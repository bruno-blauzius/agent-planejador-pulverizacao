components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token devolvido por `POST /auth/login`. Exigido apenas pelos endpoints planejados de negócio; probes e docs são públicos.
  parameters:
    FarmId:
      name: farmId
      in: path
      required: true
      schema:
        type: string
    FieldId:
      name: fieldId
      in: path
      required: true
      schema:
        type: string
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
    OwnerId:
      name: ownerId
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      description: Página, começando em 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    XRequestId:
      description: Identificador da requisição, presente em todas as respostas, útil para correlacionar logs.
      schema:
        type: string
    CacheControlNoStore:
      description: Sempre `no-store`, para que sondas de saúde nunca sejam cacheadas.
      schema:
        type: string
        const: no-store
  responses:
    HealthUp:
      description: O componente está saudável.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthReport"
          example:
            status: up
    HealthDown:
      description: O componente não está saudável.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthReport"
          example:
            status: down
    NotFound:
      description: Rota ou recurso não encontrado.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: recurso não encontrado
    MethodNotAllowed:
      description: Método HTTP não permitido para a rota.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: method_not_allowed
              message: método não permitido
    InternalError:
      description: Erro interno inesperado.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: erro interno
    Forbidden:
      description: |
        Ação não permitida (ADR 0013). `forbidden`: o papel não tem a capacidade exigida;
        `out_of_scope`: o recurso está fora das fazendas liberadas para o usuário.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden:
              value:
                error:
                  code: forbidden
                  message: você não tem permissão para esta ação
            outOfScope:
              value:
                error:
                  code: out_of_scope
                  message: fazenda fora do seu escopo
    Unauthorized:
      description: Token ausente, inválido ou expirado (ou credenciais inválidas no login).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: credenciais inválidas
    ValidationFailed:
      description: Entrada inválida. `details` aponta o campo de cada falha.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_failed
              message: dados inválidos
              details:
                - field: document
                  message: CPF inválido
    Conflict:
      description: Conflito com um recurso existente (por exemplo, CPF/CNPJ já cadastrado).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: conflict
              message: CPF já cadastrado
    PayloadTooLarge:
      description: Arquivo acima do limite.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: payload_too_large
              message: arquivo acima de 10 MB
    UnsupportedMediaType:
      description: Formato de arquivo não suportado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unsupported_media_type
              message: formato não suportado; use KML, KMZ, GeoJSON ou Shapefile (.zip)
  schemas:
    HealthStatus:
      type: string
      enum: [up, down]
      description: Estado de saúde.
    HealthCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: Nome da dependência verificada.
          examples: [postgres]
        status:
          $ref: "#/components/schemas/HealthStatus"
    HealthReport:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        checks:
          type: array
          description: Resultado por dependência. Omitido quando não há verificações.
          items:
            $ref: "#/components/schemas/HealthCheck"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Código estável da falha.
              enum:
                - not_found
                - method_not_allowed
                - internal_error
                - unauthorized
                - validation_failed
                - conflict
                - payload_too_large
                - unsupported_media_type
                - forbidden
                - out_of_scope
            message:
              type: string
              description: Mensagem legível para humanos.
            details:
              type: array
              description: Falhas por campo. Presente apenas em `validation_failed`.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    description: Caminho do campo na entrada (ex. `links[0].share_percent`).
                  message:
                    type: string
    # --- Schemas dos endpoints planejados (ADR 0010) ---------------------------
    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    GeoJsonPolygon:
      type: object
      description: Geometria GeoJSON (RFC 7946), coordenadas `[lng, lat]` em WGS84.
      required: [type, coordinates]
      properties:
        type:
          type: string
          const: Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
    GeoJsonMultiPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          const: MultiPolygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: number
    PerimeterGeometry:
      oneOf:
        - $ref: "#/components/schemas/GeoJsonPolygon"
        - $ref: "#/components/schemas/GeoJsonMultiPolygon"
    LoginRequest:
      type: object
      required: [identifier, password, remember_me]
      properties:
        identifier:
          type: string
          minLength: 1
          description: E-mail ou CPF do usuário.
          examples: [bruno@fazendasantarita.com.br, 123.278.916-05]
        password:
          type: string
          format: password
          minLength: 1
        remember_me:
          type: boolean
          description: Sessão longa ("Manter conectado"); a duração exata é configuração da API.
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    UserRole:
      type: string
      enum: [super_admin, admin, planning_operator]
      description: Papéis da ADR 0013. As capacidades de cada um estão em `Permission`.
    User:
      type: object
      description: Sessão (`GET /auth/me` e login). O front decide o que mostrar por `permissions`.
      required: [id, name, email, role, primary_farm, company, farm_scope, permissions]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        primary_farm:
          description: Fazenda principal do usuário, exibida no rodapé do menu.
          oneOf:
            - $ref: "#/components/schemas/FarmRef"
            - type: "null"
        company:
          $ref: "#/components/schemas/CompanyRef"
        farm_scope:
          $ref: "#/components/schemas/FarmScope"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    FarmRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    FarmStatus:
      type: string
      enum: [draft, active, pending]
      description: "draft: rascunho do assistente; active: cadastro completo; pending: cadastro com pendências (ex.: documentos de proprietário)."
    ProductionType:
      type: string
      enum: [coffee, grains, livestock, mixed]
    SprayCondition:
      type: string
      enum: [suitable, attention, unsuitable, rain]
      description: Condição de pulverização calculada pelo backend (spray-planner). O front apenas exibe.
    SprayOutlook:
      type: object
      description: |
        Resumo da condição de pulverização, calculado no backend a partir das regras de Delta T,
        vento e chuva. Nulo enquanto a fazenda não tiver perímetro ou previsão.
      required: [condition, headline]
      properties:
        condition:
          $ref: "#/components/schemas/SprayCondition"
        headline:
          type: string
          description: Frase curta pronta para exibir (ex. "2 janelas aptas hoje").
    Crop:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          examples: [coffee_arabica]
        name:
          type: string
          examples: [Café arábica]
    FarmOwnerShare:
      type: object
      required: [owner_id, name, role, share_percent]
      properties:
        owner_id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/LinkRole"
        share_percent:
          type: [number, "null"]
          minimum: 0
          maximum: 100
    FarmSummary:
      type: object
      required:
        - id
        - name
        - code
        - city
        - state
        - status
        - production_type
        - total_area_ha
        - productive_area_ha
        - field_count
        - crops
        - owners
        - spray_outlook
        - forecast_point
        - perimeter
        - created_at
        - company_id
      properties:
        company_id:
          type: string
          description: Empresa dona da fazenda (tenant, ADR 0013).
        id:
          type: string
        name:
          type: string
        code:
          type: [string, "null"]
          description: Apelido/código curto exibido nas etiquetas do mapa (ex. STR-01).
        city:
          type: string
        state:
          type: string
          minLength: 2
          maxLength: 2
          description: UF.
        status:
          $ref: "#/components/schemas/FarmStatus"
        production_type:
          $ref: "#/components/schemas/ProductionType"
        total_area_ha:
          type: number
          description: Área do perímetro em hectares.
        productive_area_ha:
          type: number
          description: Soma das áreas dos talhões, em hectares.
        field_count:
          type: integer
        crops:
          type: array
          items:
            $ref: "#/components/schemas/Crop"
        owners:
          type: array
          items:
            $ref: "#/components/schemas/FarmOwnerShare"
        spray_outlook:
          oneOf:
            - $ref: "#/components/schemas/SprayOutlook"
            - type: "null"
        forecast_point:
          description: Ponto de previsão, usado como marcador no modo mapa da lista.
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        perimeter:
          description: |
            Perímetro **simplificado** (poucos vértices, WGS84) para a miniatura e o modo mapa
            da lista. A geometria completa fica em `Farm.location.perimeter`.
          oneOf:
            - $ref: "#/components/schemas/PerimeterGeometry"
            - type: "null"
        created_at:
          type: string
          format: date-time
          description: Data de cadastro; alimenta o indicador "+N este mês".
    FarmLocation:
      type: object
      required: [postal_code, car_number, forecast_point, perimeter]
      properties:
        postal_code:
          type: [string, "null"]
          description: CEP, apenas dígitos.
        car_number:
          type: [string, "null"]
          description: Número do CAR (Cadastro Ambiental Rural).
        forecast_point:
          description: Ponto usado para buscar a previsão do tempo (sede ou centróide do perímetro).
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        perimeter:
          oneOf:
            - $ref: "#/components/schemas/PerimeterGeometry"
            - type: "null"
    Farm:
      allOf:
        - $ref: "#/components/schemas/FarmSummary"
        - type: object
          required: [cooperative, location, updated_at]
          properties:
            cooperative:
              type: [string, "null"]
            location:
              $ref: "#/components/schemas/FarmLocation"
            updated_at:
              type: string
              format: date-time
    FarmInput:
      type: object
      required: [name, production_type, city, state, status, location, owners]
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: [string, "null"]
        cooperative:
          type: [string, "null"]
        production_type:
          $ref: "#/components/schemas/ProductionType"
        city:
          type: string
        state:
          type: string
          minLength: 2
          maxLength: 2
        status:
          type: string
          enum: [draft, active]
          description: "`pending` é atribuído pela API, nunca enviado."
        location:
          type: object
          required: [postal_code, car_number, forecast_point, perimeter]
          properties:
            postal_code:
              type: [string, "null"]
            car_number:
              type: [string, "null"]
            forecast_point:
              oneOf:
                - $ref: "#/components/schemas/GeoPoint"
                - type: "null"
            perimeter:
              oneOf:
                - $ref: "#/components/schemas/PerimeterGeometry"
                - type: "null"
        owners:
          type: array
          items:
            $ref: "#/components/schemas/FarmOwnerShareInput"
    FarmOwnerShareInput:
      type: object
      required: [owner_id, role, share_percent]
      properties:
        owner_id:
          type: string
        role:
          $ref: "#/components/schemas/LinkRole"
        share_percent:
          type: [number, "null"]
          minimum: 0
          maximum: 100
    FarmSummaryPage:
      type: object
