          type: number
          description: Calculada pela API a partir do polígono.
        crop:
          $ref: "#/components/schemas/Crop"
        variety:
          type: [string, "null"]
          examples: [Catuaí 144]
        season:
          type: [string, "null"]
          description: Safra, ex. "2026/27".
        planting_date:
          type: [string, "null"]
          format: date
        row_spacing_m:
          type: [number, "null"]
          description: Espaçamento entre linhas, em metros.
        plant_spacing_m:
          type: [number, "null"]
          description: Espaçamento entre plantas, em metros.
        plants_per_ha:
          type: [integer, "null"]
          description: Estande calculado pela API a partir do espaçamento.
        polygon:
          $ref: "#/components/schemas/GeoJsonPolygon"
        spray_condition:
          description: Condição atual de pulverização, calculada no backend. Nula sem previsão.
          oneOf:
            - $ref: "#/components/schemas/SprayCondition"
            - type: "null"
        last_application_at:
          type: [string, "null"]
          format: date-time
    FieldInput:
      type: object
      required: [name, crop_code, polygon]
      properties:
        name:
          type: string
          minLength: 1
        block:
          type: [string, "null"]
        crop_code:
          type: string
        variety:
          type: [string, "null"]
        season:
          type: [string, "null"]
        planting_date:
          type: [string, "null"]
