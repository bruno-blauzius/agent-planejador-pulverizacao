        field_count:
          type: [integer, "null"]
          minimum: 0
          description: Polígonos internos encontrados no arquivo (possíveis talhões), além do perímetro.
    Field:
      type: object
      required:
        - id
        - farm_id
        - name
        - block
        - area_ha
        - crop
        - variety
        - season
        - planting_date
        - row_spacing_m
        - plant_spacing_m
        - plants_per_ha
        - polygon
        - spray_condition
        - last_application_at
