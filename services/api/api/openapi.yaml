openapi: 3.1.0
info:
  title: Agentes Agro API
  version: 0.1.0
  description: |
    BFF do front-end e dona dos dados de talhões e aplicações.
    Os agentes de IA (spray-planner e label-advisor) consomem esta API por HTTP.
servers:
  - url: http://localhost:8080
    description: Ambiente de desenvolvimento local
tags:
  - name: Health
    description: Sondas de saúde usadas pelo Kubernetes (liveness, startup e readiness).
  - name: Docs
    description: Contrato e documentação interativa. Disponíveis apenas quando `API_DOCS_ENABLED=true`.
  - name: Auth
    description: Login e sessão pelo SSO Inceres (Keycloak), com a API como cliente OIDC (ADR 0015). **Implementado**, exceto o `POST /auth/login` do mock, obsoleto e ainda marcado com `x-status` = planned (ver ADR 0010).
  - name: Farms
    description: |
      Cadastro de fazendas da empresa do usuário (ADR 0013). **Implementado**. Ler não exige capacidade; criar,
      editar e importar perímetro exigem `registry.write`. O operador de planejamento só enxerga as fazendas do
      seu `farm_scope` (fora dele, 404). `field_count`, `productive_area_ha` e `crops` vêm dos talhões;
      `spray_outlook` continua nulo até a integração com o planejador. `pending` é calculado: fazenda ativa com
      algum vinculado sem o documento obrigatório (ADR 0020).
  - name: Fields
    description: |
      Talhões de uma fazenda. **Implementado**. Ler não exige capacidade; cadastrar e editar exigem `registry.write`.
      A fazenda precisa ter perímetro com área; o talhão tem área própria (mínimo `API_FIELD_MIN_AREA_HA`), fica dentro
      do perímetro e não sobrepõe outro talhão da fazenda, com tolerância de desenho `API_FIELD_GEOMETRY_TOLERANCE_M2`.
      `spray_condition` e `last_application_at` continuam nulos até a integração com o planejador e as aplicações.
  - name: Terrain
    description: |
      Relevo dos talhões calculado a partir de modelo digital de elevação, ajuste manual e compatibilidade dos
      métodos de aplicação com a declividade (ADR 0021). **Implementado**. Ler não exige
      capacidade; calcular e ajustar exigem `registry.write`.

      O modelo tem 30 m de resolução e o cálculo exige um mínimo de células com declividade
      (`API_TERRAIN_MIN_VALID_CELLS`, padrão 20, cerca de 1,8 ha). Talhão menor que isso, ou sobre células sem
      dado, termina com `status` = `failed` e o motivo "dados de elevação insuficientes"; para ele só vale o
      ajuste manual. Os cálculos de todas as empresas entram numa única fila (FIFO): uma execução grande atrasa
      as demais. Um cálculo que ficou preso (processo caído) volta para a fila quando o prazo do executor vence.
  - name: Owners
    description: |
      Proprietários (pessoa física ou jurídica) e vínculos com fazendas, da empresa do usuário. **Implementado**.
      Ler não exige capacidade; escrever exige `registry.write`. O operador de planejamento só enxerga os
      proprietários vinculados às fazendas do seu `farm_scope`, e só esses vínculos. Documentos (RG, CNH,
      contrato social) ficam no S3 (ADR 0020): enviar e remover exigem `registry.write`; baixar, não.
  - name: Crops
    description: Catálogo global de culturas (igual para todas as empresas). **Implementado**.
  - name: Users
    description: Usuários, papéis, convites, inativação e exclusão lógica (ADR 0013 e 0015). **Implementado**.
  - name: Companies
    description: Empresas clientes, gestão do super admin (ADR 0013). **Implementado**.
  - name: Profile
    description: Perfil do usuário autenticado (ADR 0013). **Implementado**, exceto `POST /me/password` (obsoleto, só mock).
  - name: Trafficability
    description: |
      Chuva, estado do solo e métodos de aplicação elegíveis por dia no talhão (ADR 0022). **Implementado**
      (fase 2): pluviômetros da fazenda e leituras, vistoria e perfil de solo do talhão, e a trafegabilidade
      calculada com a chuva medida, o modelo Open-Meteo e o relevo. Ler não exige capacidade; cadastrar
      pluviômetro e definir o perfil de solo exigem `registry.write`; lançar leitura e vistoria exigem
      `field_conditions.record`. Só a API calcula o estado do solo; tela e agente consomem o mesmo veredito.
      Os limites por textura vêm da tabela de referência e ainda são heurísticos (`thresholds_source`).
  - name: Dashboard
    description: Painel do administrador (ADR 0013). **Ainda não implementado** (planned).
  - name: Planner
    description: Planejador de pulverização, confirmação humana e visão do operador (ADR 0016). **Ainda não implementado** (planned).
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Sonda de liveness
      description: |
        Usada como `livenessProbe` do Kubernetes. Indica apenas que o processo está
        respondendo; **nunca** verifica dependências externas, para que uma falha
        de banco ou de serviço vizinho não provoque reinício do contêiner.
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthDown"
  /health/startup:
    get:
      tags: [Health]
      operationId: getStartup
      summary: Sonda de startup
      description: |
        Usada como `startupProbe` do Kubernetes. Fica `down` (503) até que a
        inicialização da API termine; depois passa a responder `up` (200).
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthDown"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Sonda de readiness
      description: |
        Usada como `readinessProbe` do Kubernetes. Fica `down` (503) ao iniciar,
        durante o shutdown (para drenar o tráfego) e sempre que alguma
        dependência falhar. O campo `checks` detalha o estado de cada dependência.
      responses:
        "200":
          description: A API está pronta para receber tráfego.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
              example:
                status: up
                checks:
                  - name: postgres
                    status: up
                  - name: agent-service
                    status: up
        "503":
          description: A API não está pronta (iniciando, em shutdown ou com dependência falhando).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
              example:
                status: down
                checks:
                  - name: postgres
                    status: down
                  - name: agent-service
                    status: up
  /openapi.yaml:
    get:
      tags: [Docs]
      operationId: getOpenApiSpec
      summary: Contrato OpenAPI
      description: Devolve este contrato em YAML. Disponível apenas com `API_DOCS_ENABLED=true`; caso contrário responde 404.
      responses:
        "200":
          description: Contrato OpenAPI em YAML.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/yaml:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /docs:
    get:
      tags: [Docs]
      operationId: getDocs
      summary: Documentação interativa
      description: Página HTML com a documentação da API. Disponível apenas com `API_DOCS_ENABLED=true`; caso contrário responde 404.
      responses:
        "200":
          description: Página HTML da documentação.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  # ---------------------------------------------------------------------------
  # Endpoints planejados (contrato primeiro, ADR 0010). Ainda não implementados
  # no Go; o front usa uma implementação em memória até lá.
  # ---------------------------------------------------------------------------
  /auth/login:
    get:
      tags: [Auth]
      operationId: startLogin
      x-status: implemented
      summary: Inicia o login pelo SSO Inceres (Keycloak)
      description: |
        ADR 0015, D6. A API é o cliente OIDC confidencial `agentes-agro` (padrão BFF).
        Valida `return_to` e responde `302` para o Keycloak (realm `inceres`) com *Authorization Code*,
        PKCE S256, `state` e `nonce`. Quem já tem sessão de SSO (por outro produto) entra sem digitar a senha.
        Logo após um `POST /auth/logout` do produto, o redirecionamento leva `prompt=login`, para exigir
        reautenticação só aqui, já que a sessão de SSO continua aberta.
      security: []
      parameters:
        - name: return_to
          in: query
          description: |
            Caminho relativo para onde voltar após o login (ex.: `/farms`). Só é aceito caminho relativo à própria
            aplicação (começa com uma única `/`; sem esquema, host, `//` nem barra invertida); qualquer outro valor
            é rejeitado com `422`, contra *open redirect*. Ausente: `/`.
          schema:
            type: string
            examples: [/farms]
      responses:
        "302":
          description: Redirecionamento para o endpoint de autorização do Keycloak.
          headers:
            Location:
              description: URL do Keycloak com `client_id`, `redirect_uri` (`/auth/callback`), `code_challenge` (S256), `state` e `nonce`.
              schema:
                type: string
                format: uri
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Auth]
      operationId: login
      x-status: planned
      deprecated: true
      summary: "[Obsoleto] Autentica com e-mail e senha (somente mock)"
      description: |
        **Obsoleto e nunca será implementado no Go** (ADR 0015, D9). A API não vê nem guarda senha: a autenticação
        é do Keycloak (`GET /auth/login`). Este endpoint existe só para o mock do front (ADR 0010) até a Fase B,
        quando sai do contrato. Troca credenciais por um token Bearer. `identifier` é o e-mail; o login por CPF
        saiu do contrato. Com `remember_me: true` ("Manter conectado") o mock devolve um `expires_at` mais longo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credenciais válidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/callback:
    get:
      tags: [Auth]
      operationId: finishLogin
      x-status: implemented
      summary: Conclui o login (retorno do Keycloak)
      description: |
        ADR 0015, D6. Redirecionamento de volta do Keycloak. A API confere `state`,
        troca o `code` (cliente confidencial, PKCE), valida o ID token e o access token (assinatura, `iss`, `exp`,
        `nonce`, `aud`/`azp` = `agentes-agro`), resolve `(iss, sub)` em `user_identities`, lê papel e permissões de
        `resource_access.agentes-agro.roles`, confere que o usuário está `active` (um `invited` com e-mail verificado
        passa a `active`) e cria a sessão. Responde `302` para o `return_to` validado, com o cookie de sessão
        `agro_session` (`HttpOnly`, `Secure` sempre, `SameSite=Lax`, valor opaco).

        É navegação do navegador, então o redirecionamento é para a URL **absoluta do front**: a base fixa vem da
        configuração `AGENTES_AGRO_WEB_URL` e o `return_to` validado (nunca uma URL vinda do usuário) é concatenado a ela.
        Sem a configuração, o `Location` fica relativo (front e API no mesmo host).

        **Falhas também são `302`**, para `<front>/login?error=<código>`, nunca JSON, e nunca criam sessão (o cookie
        de fluxo é descartado em qualquer desfecho). Códigos: `user_not_provisioned`, `no_access_to_product`,
        `ambiguous_role`, `forbidden` (usuário ou empresa inativos), `identity_provider_unavailable` (Keycloak fora do ar)
        e `unavailable` (login inválido ou expirado, `state` divergente, cancelamento no Keycloak ou falha interna;
        sem detalhes). Os `403`, `422` e `502` abaixo descrevem a mesma classificação, que vira o código do redirecionamento.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Código de autorização emitido pelo Keycloak.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: Valor de correlação gerado em `GET /auth/login`; divergência é rejeitada.
          schema:
            type: string
      responses:
        "302":
          description: |
            Sessão criada e segue para o `return_to`; ou falha e segue para `/login?error=<código>` do front
            (sem `Set-Cookie` de sessão).
          headers:
            Location:
              description: |
                `<AGENTES_AGRO_WEB_URL><return_to>` em caso de sucesso (caminho validado em `GET /auth/login`) ou
                `<AGENTES_AGRO_WEB_URL>/login?error=<código>` em caso de falha. Relativo se a URL do front não estiver configurada.
              schema:
                type: string
            Set-Cookie:
              description: Cookie de sessão `agro_session` (`HttpOnly; Secure; SameSite=Lax; Path=/`), com valor opaco e aleatório.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
        "403":
          $ref: "#/components/responses/ProductAccessDenied"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "502":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      x-status: implemented
      summary: Encerra a sessão do produto
      description: |
        ADR 0015, D6, item 7. Revoga a sessão local e o refresh token no Keycloak
        (endpoint de revogação do OAuth) e apaga o cookie. **Não encerra a sessão de SSO**: os outros produtos
        continuam logados, e por isso o próximo `GET /auth/login` usa `prompt=login`. Idempotente: sem sessão
        válida também responde `204`. Como é escrita por cookie, exige proteção CSRF: o `Origin` (ou, quando o
        navegador não envia `Origin`, a origem do `Referer`) precisa estar na lista de origens permitidas (CORS).
        Sem nenhum dos dois, ou com uma origem não permitida, responde `403 forbidden`, mesmo sem sessão.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Sessão encerrada.
          headers:
            Set-Cookie:
              description: Cookie `agro_session` apagado (`Max-Age=0`).
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/backchannel-logout:
    post:
      tags: [Auth]
      operationId: backchannelLogout
      x-status: implemented
      summary: Back-channel logout (chamado pelo Keycloak)
      description: |
        ADR 0015, D6, item 5. **Cliente: o Keycloak, não o front.** Sem cookie nem Bearer;
        a autenticidade vem do `logout_token` (JWT assinado pelo realm: assinatura, `iss`, `aud` = `agentes-agro`,
        evento de back-channel logout, ausência de `nonce`). A API revoga as `auth_sessions` do `sid` (ou do `sub`)
        informado. Não exige `Origin`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token:
                  type: string
                  description: JWT de logout emitido pelo Keycloak.
      responses:
        "200":
          description: Sessões revogadas (também quando o `sid` não tem sessão neste produto).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
        "400":
          description: "`logout_token` ausente ou inválido (OIDC Back-Channel Logout). Corpo `Error` com `validation_failed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_failed
                  message: logout_token inválido
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      x-status: implemented
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Usuário autenticado
      description: |
        Devolve o usuário dono da sessão (cookie `agro_session`) **ou** do token Bearer
        (JWT do realm `inceres`, audiência `agentes-agro`). O usuário tem **exatamente um** papel do produto, lido
        do claim `resource_access.agentes-agro.roles`; `permissions` é a **interseção** desse claim com o enum
        `Permission` (nomes desconhecidos são ignorados). Empresa, escopo de fazendas e status são da API, e o
        acesso exige usuário `active` em empresa não `inactive`, verificado a cada requisição. Falhas de acesso ao
        produto respondem `403` com `user_not_provisioned`, `no_access_to_product` ou `ambiguous_role`.
      responses:
        "200":
          description: Usuário autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProductAccessDenied"
        "500":
          $ref: "#/components/responses/InternalError"
  /farms:
    get:
      tags: [Farms]
      operationId: listFarms
      x-status: implemented
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Lista fazendas
      description: Lista paginada de fazendas visíveis ao usuário, ordenada por nome.
      parameters:
        - name: search
          in: query
          description: |
            Busca por nome, código ou município, sem diferenciar maiúsculas nem acentos ("guaxupe" encontra
            "Guaxupé"; ADR 0017).
          schema:
            type: string
        - name: status
          in: query
          description: |
            `active` traz só as ativas sem pendência; `pending`, as ativas com algum vinculado sem o documento
            obrigatório.
          schema:
            $ref: "#/components/schemas/FarmStatus"
        - name: production_type
          in: query
          schema:
            $ref: "#/components/schemas/ProductionType"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de fazendas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmSummaryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Farms]
      operationId: createFarm
      x-status: implemented
      x-permission: registry.write
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Cadastra fazenda
      description: |
        Cria a fazenda e seus vínculos (assistente de 4 passos), numa transação. Com `status: draft`
        os campos de localização e proprietários podem faltar, mas a soma das participações nunca passa
        de 100%; com `status: active` a API exige perímetro e participações de proprietários (papel `owner`)
        somando exatamente 100%. Participação aceita até duas casas decimais. Sem `forecast_point`, a API
        usa o centróide do perímetro. Proprietário inexistente ou de outra empresa: 422 em `owners[i].owner_id`.
        Perímetro com autointerseção ou menor que `API_FARM_MIN_AREA_HA` (a fazenda precisa ter área em
        hectares): 422 em `location.perimeter`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmInput"
      responses:
        "201":
          description: Fazenda criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /farms/{farmId}:
    parameters:
      - $ref: "#/components/parameters/FarmId"
    get:
      tags: [Farms]
      operationId: getFarm
      x-status: implemented
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Detalhe da fazenda
      description: Fazenda com a geometria completa do perímetro em `location.perimeter`.
      responses:
        "200":
          description: Fazenda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Farms]
      operationId: updateFarm
      x-status: implemented
      x-permission: registry.write
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Atualiza fazenda
      description: |
        Substitui os dados editáveis e os vínculos da fazenda (mesmas regras do cadastro). O novo perímetro
        precisa continuar contendo os talhões já cadastrados, e a soma das áreas deles não pode passar da área
        da fazenda; com talhões, o perímetro não pode ser removido (422 em `location.perimeter`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmInput"
      responses:
        "200":
          description: Fazenda atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /perimeter-imports:
    post:
      tags: [Farms]
      operationId: importFarmPerimeter
      x-status: implemented
      x-permission: registry.write
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Importa perímetro de arquivo
      description: |
        Recebe um arquivo KML, KMZ, GeoJSON ou Shapefile (.zip) e devolve o perímetro normalizado em GeoJSON
        (WGS84), a área calculada em hectares, o ponto de previsão (centróide) e o município. Não persiste nada:
        o resultado é enviado depois em `POST /farms`. Arquivo com uma única geometria vira o perímetro inteiro
        (Polygon ou MultiPolygon); com vários polígonos, o maior é o perímetro e os demais contam em `field_count`.
        O Shapefile (ADR 0018) vem num .zip com `.shp` e `.prj`, em coordenadas geográficas WGS 84 ou SIRGAS 2000
        (o datum do CAR); coordenadas projetadas (UTM) ou outro datum respondem 422 com a orientação para exportar.
        GeoJSON com `crs` diferente de WGS84 responde 422. `municipality` e `state` vêm da malha municipal do IBGE
