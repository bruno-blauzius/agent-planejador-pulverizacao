      properties:
        farm_id:
          type: string
        role:
          $ref: "#/components/schemas/LinkRole"
        share_percent:
          type: [number, "null"]
          minimum: 0
          maximum: 100
    OwnerFarmLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OwnerFarmLink"
    OwnerSummary:
      type: object
      required: [id, person_type, name, document, has_pending_documents, links]
      properties:
        id:
          type: string
        person_type:
          $ref: "#/components/schemas/PersonType"
        name:
          type: string
          description: Nome completo (PF) ou razão social (PJ).
        document:
          type: string
          description: CPF (11 dígitos) ou CNPJ (14 dígitos), apenas dígitos. O front mascara na exibição.
        has_pending_documents:
          type: boolean
        links:
          type: array
          items:
            $ref: "#/components/schemas/OwnerFarmLink"
    Owner:
      allOf:
        - $ref: "#/components/schemas/OwnerSummary"
        - type: object
          required: [birth_date, phone, email, window_alerts_enabled, documents, created_at, updated_at]
          properties:
            birth_date:
              type: [string, "null"]
              format: date
              description: Apenas pessoa física.
            phone:
              type: [string, "null"]
              description: WhatsApp, apenas dígitos com DDD.
            email:
              type: [string, "null"]
              format: email
            window_alerts_enabled:
              type: boolean
              description: Recebe alertas de janela de pulverização no WhatsApp.
            documents:
              type: array
              items:
                $ref: "#/components/schemas/OwnerDocument"
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    OwnerInput:
      type: object
      required: [person_type, name, document, birth_date, phone, email, window_alerts_enabled]
      properties:
        person_type:
          $ref: "#/components/schemas/PersonType"
        name:
          type: string
          minLength: 1
        document:
          type: string
          description: CPF ou CNPJ, com ou sem máscara; a API normaliza e valida.
        birth_date:
          type: [string, "null"]
          format: date
        phone:
          type: [string, "null"]
        email:
          type: [string, "null"]
          format: email
        window_alerts_enabled:
          type: boolean
    OwnerSummaryPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OwnerSummary"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    # --- Página 03: empresas, papéis e permissões (ADR 0013) --------------------
    Permission:
      type: string
      enum:
        - dashboard.view
        - companies.manage
        - users.manage
        - users.manage_all
        - registry.write
        - applications.register
        - applications.confirm
        - planner.use
      description: |
        Capacidade devolvida em `User.permissions`. O front verifica capacidades, nunca nomes de papel.
        Ler cadastros (fazendas, talhões, proprietários) no próprio escopo não exige capacidade.

        | Capacidade | super_admin | admin | planning_operator |
        |---|---|---|---|
        | `dashboard.view` (Painel) | sim | sim | não |
        | `companies.manage` (Empresas) | sim | não | não |
        | `users.manage` (Usuários e convites da empresa) | sim | sim | não |
        | `users.manage_all` (usuários de todas as empresas, papel super admin) | sim | não | não |
        | `registry.write` (criar/editar fazendas, talhões, proprietários) | sim | sim | não |
        | `applications.register` (registrar aplicação) | sim | sim | sim |
        | `applications.confirm` (confirmar aplicação) | sim | sim | não |
        | `planner.use` (Planejador e agente) | sim | sim | sim |

        O operador de planejamento só enxerga as fazendas do seu `farm_scope`.
    CompanyRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    FarmScope:
      description: Fazendas que o usuário enxerga. `all` = todas da empresa; `selected` = só `farm_ids`.
      oneOf:
        - type: object
          required: [mode]
          properties:
            mode:
              type: string
              const: all
        - type: object
          required: [mode, farm_ids]
          properties:
            mode:
              type: string
              const: selected
            farm_ids:
              type: array
              minItems: 1
              items:
                type: string
    UserStatus:
      type: string
      enum: [active, invited, inactive]
      description: "invited: convite pendente (a pessoa ainda não criou a senha)."
    InvitationRef:
      type: object
      required: [id, expires_at]
      properties:
        id:
          type: string
        expires_at:
          type: string
          format: date-time
    UserAccount:
      type: object
      description: Linha da tela Usuários (usuário ou convite pendente).
      required: [id, name, email, role, company, farm_scope, status, last_access_at, invitation]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        company:
          $ref: "#/components/schemas/CompanyRef"
        farm_scope:
          $ref: "#/components/schemas/FarmScope"
        status:
          $ref: "#/components/schemas/UserStatus"
        last_access_at:
          type: [string, "null"]
          format: date-time
        invitation:
          description: Presente só quando o status é `invited`.
          oneOf:
            - $ref: "#/components/schemas/InvitationRef"
            - type: "null"
    UserAccountPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserAccount"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    UsersSummary:
      type: object
      required: [total_users, company_count, pending_invitations, by_role]
      properties:
