          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "502":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Users]
      operationId: deleteUser
      x-status: implemented
      x-permission: users.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Exclui o usuário do produto
      description: |
        **Exclusão lógica (soft delete) no produto** (ADR 0015, D5): marca o usuário como
        excluído no banco (some das listagens e responde `404`; o e-mail fica livre para novo convite), revoga as
        sessões, remove o usuário do grupo do papel no Keycloak e encerra as sessões do client `agentes-agro`.
        **Nunca apaga nem desabilita a conta do realm**: ela segue valendo para os outros produtos. A auditoria
        do usuário é preservada. Mesmas restrições de empresa e papel de `PATCH /users/{userId}`; ninguém exclui
        a si mesmo (403 `forbidden`) nem o último super admin ativo (409 `last_super_admin`). Convite pendente deve ser cancelado por `DELETE /invitations/{invitationId}`
        (409 `invitation_pending`). Ordem: o banco desativa o usuário primeiro (o acesso é cortado na hora), depois o
        provedor é limpo e só então o usuário é marcado como excluído e o vínculo com a conta é desfeito. Se o
        provedor falhar, responde `502 identity_provider_unavailable`, o usuário fica `inactive` (sem acesso) e
        repetir a chamada conclui a exclusão.
      responses:
        "204":
          description: Usuário excluído do produto.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
