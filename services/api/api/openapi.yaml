    patch:
      tags: [Users]
      operationId: updateUser
      x-status: implemented
      x-permission: users.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Altera papel, empresa, escopo ou status
      description: |
        Administrador só altera usuários da própria empresa, não atribui `super_admin`
        e não troca a empresa (403 `forbidden`). Usuário de outra empresa responde 404. Ninguém altera o próprio
        papel, a própria empresa nem desativa a própria conta (403 `forbidden`). `super_admin` só existe na
        empresa operadora da plataforma (422 em `role`). `farm_scope`
        `selected` só vale para `planning_operator` (422 em `farm_scope`) e as fazendas precisam ser da empresa.
        `name` altera o nome de exibição (dono: a API). `status: active` reativa um usuário `inactive`
        (volta ao grupo do papel no Keycloak); `status` em convite pendente responde 422 (reenvie ou cancele
        o convite). Reativar em empresa `inactive` responde `409 company_inactive`. Mudar o papel, desativar ou excluir o último
        super admin ativo responde `409 last_super_admin`.

        Papel e status passam pelo provisionador (ADR 0015, D5): mudar o papel move o usuário de subgrupo no Keycloak
        e marca as sessões dele para renovar o token; desativar (`status: inactive`) corta o acesso na hora no banco,
        revoga as sessões e remove o usuário do grupo do produto, **sem desabilitar a conta do realm** (outros produtos
        seguem). Falha do provedor responde `502 identity_provider_unavailable`, sem registro pela metade.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
