        no Keycloak; as contas do realm não são tocadas. O banco é gravado primeiro e a operação é idempotente:
        se o provedor falhar, responde `502 identity_provider_unavailable` e repetir a chamada conclui o encerramento
        das sessões. Reativar (`active` ou `trial`) não reativa usuários `inactive`: o administrador reativa um a um.
