          type: string
        field_id:
          type: string
        field_label:
          type: string
        variety:
          type: [string, "null"]
        area_ha:
          type: number
        window:
          $ref: "#/components/schemas/PlanWindow"
        product:
          type: object
          required: [kind, name, dose, mix_rate_l_per_ha]
          properties:
            kind:
              $ref: "#/components/schemas/ProductKind"
            name:
              type: string
            dose:
              $ref: "#/components/schemas/Dose"
            mix_rate_l_per_ha:
              type: number
        mix_volume_l:
          type: number
        tank_count:
          type: integer
        tank_capacity_l:
          type: number
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReviewCheck"
        operator:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        equipment:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        can_confirm:
          type: boolean
          description: Falso quando alguma checagem está `blocked`.
        expires_at:
          type: string
          format: date-time
    ApplicationRegistration:
      type: object
      required: [plan_id, field_id, review_id, confirmation]
      properties:
        plan_id:
          type: string
        field_id:
          type: string
        review_id:
          type: string
        confirmation:
          type: object
          required: [confirmed, acknowledged_warnings]
          properties:
            confirmed:
              type: boolean
              const: true
              description: Confirmação humana explícita ("Revisei as condições e confirmo a aplicação").
            acknowledged_warnings:
              type: array
              description: Códigos das checagens `warning` exibidas na revisão.
              items:
                type: string
    RegisteredApplication:
      type: object
      required: [id, status, field_id, field_label, area_ha, window, registered_at, registered_by]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [planned]
        field_id:
          type: string
        field_label:
          type: string
        area_ha:
          type: number
        window:
          $ref: "#/components/schemas/PlanWindow"
        registered_at:
          type: string
          format: date-time
        registered_by:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
    TodayStatus:
      type: object
      required: [condition, headline, until_time, remaining_minutes, window_start, window_end]
      properties:
        condition:
          $ref: "#/components/schemas/SprayCondition"
        headline:
          type: string
          examples: [Pode pulverizar]
        until_time:
          type: [string, "null"]
        remaining_minutes:
          type: [integer, "null"]
        window_start:
          type: [string, "null"]
        window_end:
          type: [string, "null"]
    TodayMetric:
      type: object
      required: [kind, label, value, unit, condition]
      properties:
        kind:
          type: string
          enum: [delta_t, wind, rain]
        label:
          type: string
          examples: [Chuva 4h]
        value:
          type: number
        unit:
          type: string
          examples: ["°C", km/h, mm]
        condition:
          $ref: "#/components/schemas/SprayCondition"
    TodayHour:
      type: object
      required: [hour, condition, is_current]
      properties:
        hour:
          type: integer
        condition:
          $ref: "#/components/schemas/SprayCondition"
        is_current:
          type: boolean
    TodayTask:
      type: object
      required: [id, field_id, field_label, field_name, operation, area_ha, dose, tank_count, tank_capacity_l, status]
      properties:
        id:
          type: string
        field_id:
          type: string
        field_label:
          type: string
        field_name:
          type: string
        operation:
          type: string
          examples: [Fungicida]
        area_ha:
          type: number
        dose:
          $ref: "#/components/schemas/Dose"
        tank_count:
          type: integer
        tank_capacity_l:
          type: number
        status:
          type: string
          enum: [planned, in_progress]
    TodayBrief:
      type: object
      required: [farm, as_of, status, metrics, hours, task]
      properties:
        farm:
          $ref: "#/components/schemas/FarmRef"
        as_of:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/TodayStatus"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/TodayMetric"
        hours:
          type: array
          items:
            $ref: "#/components/schemas/TodayHour"
        task:
          oneOf:
            - $ref: "#/components/schemas/TodayTask"
            - type: "null"
    # --- Aplicações: histórico e detalhe (ADR 0016) -------------------------------
    PersonRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    ApplicationStatus:
      type: string
      enum: [planned, in_progress, completed, cancelled]
      description: "planned: registrada após confirmação e ainda não executada; in_progress: iniciada pelo operador; completed: concluída; cancelled: cancelada."
    ApplicationWindow:
      type: object
      required: [date, start_time, end_time]
      properties:
        date:
          type: string
          format: date
        start_time:
          type: string
          description: Hora local da fazenda (HH:mm).
        end_time:
          type: string
    ApplicationFieldRef:
      type: object
      required: [id, label, name, variety, block]
      properties:
        id:
          type: string
        label:
          type: string
          examples: [T5]
        name:
          type: string
          examples: [Talhão 5]
        variety:
          type: [string, "null"]
        block:
          type: [string, "null"]
    ApplicationProduct:
      type: object
      required: [kind, name, dose, mix_rate_l_per_ha]
      properties:
        kind:
          $ref: "#/components/schemas/ProductKind"
        name:
          type: string
        dose:
          $ref: "#/components/schemas/Dose"
        mix_rate_l_per_ha:
          type: number
    ApplicationConditionsSummary:
      type: object
      description: |
        Condições da linha da lista. `recorded`: medidas na aplicação; `forecast`: previsão para a janela;
        `live`: sem números ainda (previsão ao vivo). `rain_mm` preenchido numa cancelada indica chuva como motivo.
      required: [source, delta_t_c, wind_kmh, rain_mm]
      properties:
        source:
          type: string
          enum: [recorded, forecast, live]
        delta_t_c:
          type: [number, "null"]
        wind_kmh:
          type: [number, "null"]
        rain_mm:
          type: [number, "null"]
    ApplicationSummary:
      type: object
      required: [id, status, farm_id, window, field, product, area_ha, conditions, operator]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        farm_id:
          type: string
        window:
          $ref: "#/components/schemas/ApplicationWindow"
        field:
          $ref: "#/components/schemas/ApplicationFieldRef"
        product:
          $ref: "#/components/schemas/ApplicationProduct"
        area_ha:
          type: number
        conditions:
          $ref: "#/components/schemas/ApplicationConditionsSummary"
        operator:
          $ref: "#/components/schemas/PersonRef"
    ApplicationFacets:
      type: object
      description: Opções dos filtros no escopo do usuário, sem aplicar os filtros da requisição.
      required: [fields, operators]
      properties:
        fields:
          type: array
          items:
            type: object
            required: [id, label, name]
            properties:
              id:
                type: string
              label:
                type: string
              name:
                type: string
        operators:
          type: array
          items:
            $ref: "#/components/schemas/PersonRef"
    ApplicationMonthSummary:
      type: object
      description: Indicadores do topo da tela Aplicações, do mês corrente. Todos os números são calculados pela API.
      required: [month_count, applied_area, within_window, next]
      properties:
        month_count:
          type: object
          description: Aplicações do mês por status ("No mês").
          required: [total, planned, in_progress, completed, cancelled]
          properties:
            total:
              type: integer
            planned:
              type: integer
            in_progress:
              type: integer
            completed:
              type: integer
            cancelled:
              type: integer
        applied_area:
          type: object
          description: Área aplicada no mês e a participação na área produtiva ("Área aplicada").
          required: [area_ha, productive_area_ha, percent]
          properties:
            area_ha:
              type: number
            productive_area_ha:
              type: number
            percent:
              type: [integer, "null"]
        within_window:
          type: object
          description: Aplicações do mês com Delta T e vento ideais ("Dentro da janela"). `percent` é nulo sem aplicações.
          required: [percent, within, total]
          properties:
            percent:
              type: [integer, "null"]
            within:
              type: integer
            total:
              type: integer
        next:
          description: Próxima aplicação planejada ("Próxima"); nula sem planejadas.
          oneOf:
            - type: object
              required: [application_id, date, start_time, end_time, field_label, product_name]
              properties:
                application_id:
                  type: string
                date:
                  type: string
                  format: date
                start_time:
                  type: string
                end_time:
                  type: string
                field_label:
                  type: string
                product_name:
                  type: string
            - type: "null"
    ApplicationPage:
      type: object
      required: [items, total, page, page_size, facets, summary]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationSummary"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        facets:
          $ref: "#/components/schemas/ApplicationFacets"
        summary:
          $ref: "#/components/schemas/ApplicationMonthSummary"
    ApplicationDetail:
      allOf:
        - $ref: "#/components/schemas/ApplicationSummary"
        - type: object
          required: [registered_at, recorded_conditions, usage, pre_harvest, equipment, confirmed_by, signed, cancellation]
          properties:
            registered_at:
              type: string
              format: date-time
            recorded_conditions:
              description: Nulo enquanto não há condições registradas (planejada, cancelada sem medição).
              oneOf:
                - type: object
                  required: [headline, delta_t_c, wind_kmh, rain_mm, rain_hours, duration_minutes]
                  properties:
                    headline:
                      type: string
                      examples: [Dentro da janela]
                    delta_t_c:
                      type: number
                    wind_kmh:
                      type: number
                    rain_mm:
                      type: number
                    rain_hours:
                      type: integer
                      description: Horizonte da chuva ("Chuva 8h").
                    duration_minutes:
                      type: integer
                - type: "null"
            usage:
              type: object
              description: Totais calculados pela API.
              required: [lot, dose_total_l, mix_total_l, tank_count, tank_capacity_l]
              properties:
                lot:
                  type: [string, "null"]
                dose_total_l:
                  type: number
                mix_total_l:
                  type: number
                tank_count:
                  type: integer
                tank_capacity_l:
                  type: number
            pre_harvest:
              oneOf:
                - type: object
                  required: [days, released_from]
                  properties:
                    days:
                      type: integer
                    released_from:
                      type: [string, "null"]
                      format: date
                - type: "null"
            equipment:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                name:
                  type: string
            confirmed_by:
              oneOf:
                - type: object
                  required: [person, at]
                  properties:
                    person:
                      $ref: "#/components/schemas/PersonRef"
                    at:
                      type: string
                      format: date-time
                - type: "null"
            signed:
              type: boolean
              description: Registro assinado digitalmente (válido para o caderno de campo).
            cancellation:
              oneOf:
                - type: object
                  required: [reason]
                  properties:
                    reason:
                      type: string
                - type: "null"
    CurrentWeather:
      type: object
      required: [farm_id, city, state, temperature_c, wind_kmh, observed_at]
      properties:
        farm_id:
          type: string
        city:
          type: string
        state:
          type: string
        temperature_c:
          type: number
        wind_kmh:
          type: number
        observed_at:
          type: string
          format: date-time
