    # --- Página 03: empresas, papéis e permissões (ADR 0013) --------------------
    Permission:
      type: string
      enum:
        - dashboard.view
        - companies.manage
        - users.manage
        - users.manage_all
        - registry.write
        - applications.register
        - applications.confirm
        - planner.use
        - field_conditions.record
      description: |
        Capacidade devolvida em `User.permissions`. O front verifica capacidades, nunca nomes de papel.

        **Especificação do realm (ADR 0015, D3):** este enum e a tabela abaixo são a fonte única do que o realm
        `inceres` implementa como *client roles* do client `agentes-agro` (9 permissões e 3 papéis compostos);
        o teste de contrato `make keycloak-test` falha se divergirem. A API não mantém tabela papel → permissões:
        vale a interseção do claim do token com este enum.
        Ler cadastros (fazendas, talhões, proprietários) no próprio escopo não exige capacidade.

        | Capacidade | super_admin | admin | planning_operator |
        |---|---|---|---|
        | `dashboard.view` (Painel) | sim | sim | não |
        | `companies.manage` (Empresas) | sim | não | não |
        | `users.manage` (Usuários e convites da empresa) | sim | sim | não |
        | `users.manage_all` (usuários de todas as empresas, papel super admin) | sim | não | não |
        | `registry.write` (criar/editar fazendas, talhões, proprietários) | sim | sim | não |
        | `applications.register` (registrar aplicação) | sim | sim | sim |
        | `applications.confirm` (confirmar aplicação) | sim | sim | não |
        | `planner.use` (Planejador e agente) | sim | sim | sim |
        | `field_conditions.record` (lançar leitura de pluviômetro e vistoria do solo) | sim | sim | sim |

        O operador de planejamento só enxerga as fazendas do seu `farm_scope`.
    CompanyRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    FarmScope:
      description: Fazendas que o usuário enxerga. `all` = todas da empresa; `selected` = só `farm_ids`.
      oneOf:
        - type: object
          required: [mode]
          properties:
            mode:
              type: string
              const: all
        - type: object
          required: [mode, farm_ids]
          properties:
            mode:
              type: string
              const: selected
            farm_ids:
              type: array
              minItems: 1
              items:
                type: string
    UserStatus:
      type: string
      enum: [active, invited, inactive]
      description: "invited: convite pendente (a pessoa ainda não criou a senha)."
    InvitationRef:
      type: object
