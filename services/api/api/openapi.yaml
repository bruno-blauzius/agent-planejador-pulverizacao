    post:
      tags: [Users]
      operationId: createInvitation
      x-status: implemented
      x-permission: users.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Convida um usuário por e-mail
      description: |
        Envia o e-mail para a pessoa criar a senha e devolve a linha do usuário
        com `status: invited`. Mesmas restrições de papel/empresa de `PATCH /users/{userId}`. A empresa do convite
        nunca vem do cliente para o administrador: ele só convida para a própria (403 `forbidden` se divergir).
        E-mail já usado no produto responde `409 email_already_registered`; empresa `inactive` responde
        `409 company_inactive`; conta existente no realm com e-mail **não verificado** não é vinculada e responde
        `409 email_not_verified` (o provisionador reenvia a verificação). Conta existente com e-mail verificado é
        reaproveitada e o vínculo vai para a auditoria.

        O convite passa pelo provisionador (ADR 0015, D5 e D7): reaproveita a conta do realm quando o e-mail já existe
        (de outro produto, com e-mail verificado) ou cria uma nova com `VERIFY_EMAIL` e `UPDATE_PASSWORD`, e coloca o
        usuário no grupo do papel. Se o e-mail não puder sair (SMTP do realm ausente ou falha), o convite **continua
        válido** e a resposta `201` informa isso no cabeçalho `X-Invitation-Email: not_sent`; o front pode reenviar.
        Provedor fora do ar responde `502 identity_provider_unavailable`; o que foi criado nele é desfeito.
      requestBody:
