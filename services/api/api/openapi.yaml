      description: |
        Mesmo escopo de `GET /users`: administrador só enxerga usuários da própria empresa;
        usuário de outra empresa (ou excluído) responde `404`, nunca `403`, para não revelar que existe.
      responses:
        "200":
          description: Usuário.
