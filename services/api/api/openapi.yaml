openapi: 3.1.0
info:
  title: Agentes Agro API
  version: 0.1.0
  description: |
    BFF do front-end e dona dos dados de talhões e aplicações.
    Os agentes de IA (spray-planner e label-advisor) consomem esta API por HTTP.
servers:
  - url: http://localhost:8080
    description: Ambiente de desenvolvimento local
tags:
  - name: Health
    description: Sondas de saúde usadas pelo Kubernetes (liveness, startup e readiness).
  - name: Docs
    description: Contrato e documentação interativa. Disponíveis apenas quando `API_DOCS_ENABLED=true`.
  - name: Auth
    description: Autenticação do usuário do front. **Ainda não implementado** (marcado com `x-status` = planned; ver ADR 0010).
  - name: Farms
    description: Cadastro de fazendas. **Ainda não implementado** (marcado com `x-status` = planned; ver ADR 0010).
  - name: Fields
    description: Talhões de uma fazenda. **Ainda não implementado** (marcado com `x-status` = planned; ver ADR 0010).
  - name: Owners
    description: Proprietários (pessoa física ou jurídica) e vínculos com fazendas. **Ainda não implementado** (marcado com `x-status` = planned; ver ADR 0010).
  - name: Crops
    description: Catálogo de culturas. **Ainda não implementado** (marcado com `x-status` = planned; ver ADR 0010).
  - name: Users
    description: Usuários, papéis e convites (ADR 0013). **Ainda não implementado** (planned).
  - name: Companies
    description: Empresas clientes, gestão do super admin (ADR 0013). **Ainda não implementado** (planned).
  - name: Profile
    description: Perfil do usuário autenticado (ADR 0013). **Ainda não implementado** (planned).
  - name: Dashboard
    description: Painel do administrador (ADR 0013). **Ainda não implementado** (planned).
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Sonda de liveness
      description: |
        Usada como `livenessProbe` do Kubernetes. Indica apenas que o processo está
        respondendo; **nunca** verifica dependências externas, para que uma falha
        de banco ou de serviço vizinho não provoque reinício do contêiner.
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthDown"
  /health/startup:
    get:
      tags: [Health]
      operationId: getStartup
      summary: Sonda de startup
      description: |
        Usada como `startupProbe` do Kubernetes. Fica `down` (503) até que a
        inicialização da API termine; depois passa a responder `up` (200).
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthDown"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Sonda de readiness
      description: |
        Usada como `readinessProbe` do Kubernetes. Fica `down` (503) ao iniciar,
        durante o shutdown (para drenar o tráfego) e sempre que alguma
        dependência falhar. O campo `checks` detalha o estado de cada dependência.
      responses:
        "200":
          description: A API está pronta para receber tráfego.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
              example:
                status: up
                checks:
                  - name: postgres
                    status: up
                  - name: agent-service
                    status: up
        "503":
          description: A API não está pronta (iniciando, em shutdown ou com dependência falhando).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
              example:
                status: down
                checks:
                  - name: postgres
                    status: down
                  - name: agent-service
                    status: up
  /openapi.yaml:
    get:
      tags: [Docs]
      operationId: getOpenApiSpec
      summary: Contrato OpenAPI
      description: Devolve este contrato em YAML. Disponível apenas com `API_DOCS_ENABLED=true`; caso contrário responde 404.
      responses:
        "200":
          description: Contrato OpenAPI em YAML.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/yaml:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /docs:
    get:
      tags: [Docs]
      operationId: getDocs
      summary: Documentação interativa
      description: Página HTML com a documentação da API. Disponível apenas com `API_DOCS_ENABLED=true`; caso contrário responde 404.
      responses:
        "200":
          description: Página HTML da documentação.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  # ---------------------------------------------------------------------------
  # Endpoints planejados (contrato primeiro, ADR 0010). Ainda não implementados
  # no Go; o front usa uma implementação em memória até lá.
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      x-status: planned
      summary: Autentica com e-mail ou CPF e senha
      description: |
        Ainda não implementado. Troca credenciais por um token de acesso Bearer.
        `identifier` aceita e-mail ou CPF (com ou sem máscara). Com `remember_me: true`
        ("Manter conectado") a API devolve um `expires_at` mais longo; o front alinha a
        validade do cookie a esse valor.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credenciais válidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      x-status: planned
      security:
        - bearerAuth: []
      summary: Usuário autenticado
      description: Ainda não implementado. Devolve o usuário dono do token enviado.
      responses:
        "200":
          description: Usuário autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /farms:
    get:
      tags: [Farms]
      operationId: listFarms
      x-status: planned
      security:
        - bearerAuth: []
      summary: Lista fazendas
      description: Ainda não implementado. Lista paginada de fazendas visíveis ao usuário.
      parameters:
        - name: search
          in: query
          description: Busca por nome, código ou município (sem diferenciar maiúsculas e acentos).
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/FarmStatus"
        - name: production_type
          in: query
          schema:
            $ref: "#/components/schemas/ProductionType"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de fazendas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmSummaryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Farms]
      operationId: createFarm
      x-status: planned
      security:
        - bearerAuth: []
      summary: Cadastra fazenda
      description: |
        Ainda não implementado. Cria a fazenda (assistente de 4 passos). Com `status: draft`
        os campos de localização e proprietários podem faltar; com `status: active` a API
        exige perímetro e participações de proprietários somando 100%.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmInput"
      responses:
        "201":
          description: Fazenda criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /farms/{farmId}:
    parameters:
      - $ref: "#/components/parameters/FarmId"
    get:
      tags: [Farms]
      operationId: getFarm
      x-status: planned
      security:
        - bearerAuth: []
      summary: Detalhe da fazenda
      description: Ainda não implementado.
      responses:
        "200":
          description: Fazenda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Farms]
      operationId: updateFarm
      x-status: planned
      security:
        - bearerAuth: []
      summary: Atualiza fazenda
      description: Ainda não implementado. Substitui os dados editáveis da fazenda (mesmas regras do cadastro).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmInput"
      responses:
        "200":
          description: Fazenda atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /perimeter-imports:
    post:
      tags: [Farms]
      operationId: importFarmPerimeter
      x-status: planned
      security:
        - bearerAuth: []
      summary: Importa perímetro de arquivo
      description: |
        Ainda não implementado. Recebe um arquivo KML, KMZ, GeoJSON ou Shapefile compactado (.zip)
        e devolve o perímetro normalizado em GeoJSON (WGS84), a área calculada em hectares e o
        ponto de previsão (centróide). Não persiste nada: o resultado é enviado depois em `POST /farms`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo .kml, .kmz, .geojson/.json ou .zip (Shapefile). Até 20 MB.
      responses:
        "200":
          description: Perímetro extraído.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerimeterImport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /farms/{farmId}/fields:
    parameters:
      - $ref: "#/components/parameters/FarmId"
    get:
      tags: [Fields]
      operationId: listFarmFields
      x-status: planned
      security:
        - bearerAuth: []
      summary: Lista talhões da fazenda
      description: Ainda não implementado. Todos os talhões da fazenda, com o bloco (área) de cada um.
      responses:
        "200":
          description: Talhões da fazenda.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Field"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Fields]
      operationId: createField
      x-status: planned
      security:
        - bearerAuth: []
      summary: Cadastra talhão
      description: Ainda não implementado. A área em hectares é calculada pela API a partir do polígono.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldInput"
      responses:
        "201":
          description: Talhão criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /farms/{farmId}/fields/{fieldId}:
    parameters:
      - $ref: "#/components/parameters/FarmId"
      - $ref: "#/components/parameters/FieldId"
    put:
      tags: [Fields]
      operationId: updateField
      x-status: planned
      security:
        - bearerAuth: []
      summary: Atualiza talhão
      description: >-
        Ainda não implementado. Substitui os dados editáveis do talhão (mesmo corpo do cadastro).
        A área e o estande são recalculados pela API; condição de aplicação e última aplicação não são editáveis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldInput"
      responses:
        "200":
          description: Talhão atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /crops:
    get:
      tags: [Crops]
      operationId: listCrops
      x-status: planned
      security:
        - bearerAuth: []
      summary: Catálogo de culturas
      description: Ainda não implementado. Culturas disponíveis para o cadastro de talhões.
      responses:
        "200":
          description: Culturas.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Crop"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /owners:
    get:
      tags: [Owners]
      operationId: listOwners
      x-status: planned
      security:
        - bearerAuth: []
      summary: Lista proprietários
      description: Ainda não implementado. Lista paginada com os vínculos resumidos de cada proprietário.
      parameters:
        - name: search
          in: query
          description: Busca por nome/razão social ou CPF/CNPJ (com ou sem máscara).
          schema:
            type: string
        - name: person_type
          in: query
          schema:
            $ref: "#/components/schemas/PersonType"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de proprietários.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSummaryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Owners]
      operationId: createOwner
      x-status: planned
      security:
        - bearerAuth: []
      summary: Cadastra proprietário
      description: Ainda não implementado. A API valida o CPF/CNPJ (dígitos verificadores) e rejeita duplicados com 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerInput"
      responses:
        "201":
          description: Proprietário criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /owners/{ownerId}:
    parameters:
      - $ref: "#/components/parameters/OwnerId"
    get:
      tags: [Owners]
      operationId: getOwner
      x-status: planned
      security:
        - bearerAuth: []
      summary: Detalhe do proprietário
      description: Ainda não implementado.
      responses:
        "200":
          description: Proprietário.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Owners]
      operationId: updateOwner
      x-status: planned
      security:
        - bearerAuth: []
      summary: Atualiza proprietário
      description: Ainda não implementado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerInput"
      responses:
        "200":
          description: Proprietário atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /owners/{ownerId}/links:
    parameters:
      - $ref: "#/components/parameters/OwnerId"
    get:
      tags: [Owners]
      operationId: getOwnerLinks
      x-status: planned
      security:
        - bearerAuth: []
      summary: Vínculos do proprietário com fazendas
      description: Ainda não implementado.
      responses:
        "200":
          description: Vínculos atuais.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerFarmLinkList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Owners]
      operationId: replaceOwnerLinks
      x-status: planned
      security:
        - bearerAuth: []
      summary: Substitui os vínculos do proprietário
      description: |
        Ainda não implementado. Substitui todos os vínculos do proprietário. A API rejeita com 422
        se a participação total de alguma fazenda passar de 100%.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [links]
              properties:
                links:
                  type: array
                  items:
                    $ref: "#/components/schemas/OwnerFarmLinkInput"
      responses:
        "200":
          description: Vínculos atualizados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerFarmLinkList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  # ---------------------------------------------------------------------------
  # Página 03: administração, painel e perfil (ADR 0013). Planned (ADR 0010).
  # ---------------------------------------------------------------------------
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      x-status: planned
      x-permission: users.manage
      security:
        - bearerAuth: []
      summary: Lista usuários e convites pendentes
      description: |
        Ainda não implementado. Usuários e convites pendentes (`status: invited`) visíveis ao chamador.
        Administrador vê só a própria empresa; super admin (`users.manage_all`) vê todas e pode filtrar por `company_id`.
      parameters:
        - name: search
          in: query
          description: Busca por nome, e-mail ou empresa.
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: company_id
          in: query
          description: Só super admin; para os demais é sempre a própria empresa.
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de usuários.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccountPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /users/summary:
    get:
      tags: [Users]
      operationId: getUsersSummary
      x-status: planned
      x-permission: users.manage
      security:
        - bearerAuth: []
      summary: Contagem de usuários por papel
      description: Ainda não implementado. Mesmo escopo de `GET /users` (cartões de papel da tela Usuários).
      responses:
        "200":
          description: Resumo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Users]
      operationId: updateUser
      x-status: planned
      x-permission: users.manage
      security:
        - bearerAuth: []
      summary: Altera papel, empresa, escopo ou status
      description: |
        Ainda não implementado. Administrador só altera usuários da própria empresa, não atribui `super_admin`
        e não troca a empresa (403 `forbidden`). Usuário de outra empresa responde 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Usuário atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /invitations:
    post:
      tags: [Users]
      operationId: createInvitation
      x-status: planned
      x-permission: users.manage
      security:
        - bearerAuth: []
      summary: Convida um usuário por e-mail
      description: |
        Ainda não implementado. Envia o e-mail para a pessoa criar a senha e devolve a linha do usuário
        com `status: invited`. Mesmas restrições de papel/empresa de `PATCH /users/{userId}`. E-mail já usado responde 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Convite criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "401":
