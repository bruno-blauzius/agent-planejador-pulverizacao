components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: agro_session
      description: |
        Sessão do navegador (ADR 0015, D6), criada por `GET /auth/callback`: valor opaco e aleatório,
        `HttpOnly`, `SameSite=Lax`, `Secure` sempre. Escrita por cookie exige `Origin` na lista do CORS.
        Alternativa ao `bearerAuth`: o endpoint aceita um **ou** outro.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT do realm `inceres` (audiência `agentes-agro`), para clientes máquina a máquina e Swagger (ADR 0015, D6).
        Alternativa ao `sessionCookie`. Enquanto o login real não existe, o mock do front usa o token de `POST /auth/login` (obsoleto).
    openIdConnect:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8180/realms/inceres/.well-known/openid-configuration
      description: |
        Descoberta OIDC do realm `inceres` (valor de desenvolvimento; em outros ambientes o emissor é configuração).
        Quem fala OIDC é a API (client confidencial `agentes-agro`); o front e os clientes só usam `sessionCookie` ou `bearerAuth`.
  parameters:
    FarmId:
      name: farmId
      in: path
      required: true
      schema:
        type: string
    FieldId:
      name: fieldId
      in: path
      required: true
      schema:
        type: string
    RainGaugeId:
      name: gaugeId
      in: path
      required: true
      schema:
        type: string
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
    OwnerId:
      name: ownerId
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      description: Página, começando em 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    XRequestId:
      description: Identificador da requisição, presente em todas as respostas, útil para correlacionar logs.
      schema:
        type: string
    CacheControlNoStore:
      description: Sempre `no-store`, para que sondas de saúde nunca sejam cacheadas.
      schema:
        type: string
        const: no-store
    InvitationEmail:
      description: |
        Se o e-mail de definição de senha saiu (ADR 0015, D5 e D7). `not_sent` quando o SMTP do realm não está
        configurado ou falhou: o convite continua válido e pode ser reenviado. `not_needed` quando a conta já existia
        no realm (de outro produto) e o usuário só entra.
      schema:
        type: string
        enum: [sent, not_sent, not_needed]
  responses:
    HealthUp:
      description: O componente está saudável.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthReport"
          example:
            status: up
    HealthDown:
      description: O componente não está saudável.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthReport"
          example:
            status: down
    NotFound:
      description: Rota ou recurso não encontrado.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: recurso não encontrado
    MethodNotAllowed:
      description: Método HTTP não permitido para a rota.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: method_not_allowed
              message: método não permitido
    InternalError:
      description: Erro interno inesperado.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: erro interno
    BadGateway:
      description: |
        Dependência externa indisponível (ADR 0016). `agent_unavailable`: o agente não respondeu;
        `weather_unavailable`: a previsão do tempo está fora do ar. Nunca há resposta inventada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            agent:
              value:
                error:
                  code: agent_unavailable
                  message: o agente de pulverização está indisponível
            weather:
              value:
                error:
                  code: weather_unavailable
                  message: a previsão do tempo está indisponível
    IdentityProviderUnavailable:
      description: |
        O provedor de identidade (Keycloak) está indisponível ou recusou a operação (ADR 0015, D5). Nada fica
        registrado pela metade: o que foi criado no provedor é desfeito, e o erro é informado, nunca inventado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: identity_provider_unavailable
              message: o provedor de identidade está indisponível
    DocumentStorageUnavailable:
      description: |
        O armazenamento dos documentos de proprietário (S3, ADR 0020) está fora do ar ou não foi configurado.
        Nada fica registrado pela metade: o arquivo enviado é apagado se o registro falhar.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: document_storage_unavailable
              message: o armazenamento de documentos está indisponível; tente mais tarde
    ProductAccessDenied:
      description: |
        A identidade é válida, mas não dá acesso ao produto (ADR 0015, D3 e D4). `user_not_provisioned`: a conta
        existe no SSO, mas ninguém a convidou para o Agentes Agro (não há provisionamento no primeiro login);
        `no_access_to_product`: a conta não tem nenhum papel do produto; `ambiguous_role`: tem mais de um
        (nunca vale o mais alto; gera auditoria). Usuário `inactive` ou empresa `inactive` responde `forbidden`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notProvisioned:
              value:
                error:
                  code: user_not_provisioned
                  message: sua conta ainda não foi convidada para o Agentes Agro
            noAccess:
              value:
                error:
                  code: no_access_to_product
                  message: sua conta não tem acesso ao Agentes Agro
            ambiguousRole:
              value:
                error:
                  code: ambiguous_role
                  message: sua conta tem mais de um papel no Agentes Agro
            inactive:
              value:
                error:
                  code: forbidden
                  message: usuário ou empresa inativos
    Forbidden:
      description: |
        Ação não permitida (ADR 0013). `forbidden`: o papel não tem a capacidade exigida;
        `out_of_scope`: o recurso está fora das fazendas liberadas para o usuário.
        Em `GET /auth/me` e `GET /auth/callback`, a falta de acesso ao produto usa `ProductAccessDenied`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden:
              value:
                error:
                  code: forbidden
                  message: você não tem permissão para esta ação
            outOfScope:
              value:
                error:
                  code: out_of_scope
                  message: fazenda fora do seu escopo
    Unauthorized:
      description: Token ausente, inválido ou expirado (ou credenciais inválidas no login).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: credenciais inválidas
    ValidationFailed:
      description: Entrada inválida. `details` aponta o campo de cada falha.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_failed
              message: dados inválidos
              details:
                - field: document
                  message: CPF inválido
    Conflict:
      description: |
        Conflito com um recurso existente ou com o estado dele. `conflict`: duplicidade genérica (CPF/CNPJ);
        `email_already_registered`: e-mail já usado por usuário do produto; `email_not_verified`: conta do realm com
        e-mail não verificado (não é vinculada); `company_inactive`: empresa inativa;
        `company_has_active_users`: exclusão de empresa com usuários `active` ou `invited`;
        `invitation_closed`: convite já aceito ou cancelado; `invitation_pending`: usuário com convite aberto
        não é excluído, o convite é cancelado; `last_super_admin`: a operação deixaria a plataforma sem nenhum
        super admin ativo (desativar, excluir ou rebaixar o último).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            duplicate:
              value:
                error:
                  code: conflict
                  message: CPF já cadastrado
            emailAlreadyRegistered:
              value:
                error:
                  code: email_already_registered
                  message: e-mail já cadastrado
            emailNotVerified:
              value:
                error:
                  code: email_not_verified
                  message: a conta existente ainda não verificou o e-mail
            companyInactive:
              value:
                error:
                  code: company_inactive
                  message: a empresa está inativa
            companyHasActiveUsers:
              value:
                error:
                  code: company_has_active_users
                  message: a empresa ainda tem usuários ativos ou convidados
            invitationClosed:
              value:
                error:
                  code: invitation_closed
                  message: o convite já foi aceito ou cancelado
            invitationPending:
              value:
                error:
                  code: invitation_pending
                  message: usuário com convite pendente; cancele o convite
            lastSuperAdmin:
              value:
                error:
                  code: last_super_admin
                  message: a plataforma precisa de ao menos um super admin ativo
    PayloadTooLarge:
      description: Arquivo acima do limite.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: payload_too_large
              message: arquivo acima de 10 MB
    UnsupportedMediaType:
      description: Formato de arquivo não suportado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unsupported_media_type
              message: formato não suportado; use KML, KMZ, GeoJSON ou Shapefile (.zip)
  schemas:
    HealthStatus:
      type: string
      enum: [up, down]
      description: Estado de saúde.
    HealthCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: Nome da dependência verificada.
          examples: [postgres]
        status:
          $ref: "#/components/schemas/HealthStatus"
    HealthReport:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        checks:
          type: array
          description: Resultado por dependência. Omitido quando não há verificações.
          items:
            $ref: "#/components/schemas/HealthCheck"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Código estável da falha.
              enum:
                - not_found
                - method_not_allowed
                - internal_error
                - unauthorized
                - validation_failed
                - conflict
                - payload_too_large
                - unsupported_media_type
                - forbidden
                - out_of_scope
                - agent_unavailable
                - weather_unavailable
                - conditions_changed
                - user_not_provisioned
                - no_access_to_product
                - ambiguous_role
                - identity_provider_unavailable
                - email_already_registered
                - email_not_verified
                - company_inactive
                - company_has_active_users
                - invitation_closed
                - invitation_pending
                - last_super_admin
            message:
              type: string
              description: Mensagem legível para humanos.
            details:
              type: array
              description: Falhas por campo. Presente apenas em `validation_failed`.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    description: Caminho do campo na entrada (ex. `links[0].share_percent`).
                  message:
                    type: string
    # --- Schemas dos endpoints planejados (ADR 0010) ---------------------------
    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    GeoJsonPolygon:
      type: object
      description: Geometria GeoJSON (RFC 7946), coordenadas `[lng, lat]` em WGS84.
      required: [type, coordinates]
      properties:
        type:
          type: string
          const: Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
    GeoJsonMultiPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          const: MultiPolygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: number
    PerimeterGeometry:
      oneOf:
        - $ref: "#/components/schemas/GeoJsonPolygon"
        - $ref: "#/components/schemas/GeoJsonMultiPolygon"
    LoginRequest:
      type: object
      deprecated: true
      description: Obsoleto, só para o mock (ver `POST /auth/login`).
      required: [identifier, password, remember_me]
      properties:
        identifier:
          type: string
          minLength: 1
          description: E-mail do usuário. O login por CPF saiu do contrato (nenhum campo de usuário guarda CPF).
          examples: [bruno@fazendasantarita.com.br]
        password:
          type: string
          format: password
          minLength: 1
        remember_me:
          type: boolean
          description: Sessão longa ("Manter conectado"); a duração exata é configuração da API.
    LoginResponse:
      type: object
      deprecated: true
      description: Obsoleto, só para o mock (ver `POST /auth/login`).
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    UserRole:
      type: string
      enum: [super_admin, admin, planning_operator]
      description: Papéis da ADR 0013. As capacidades de cada um estão em `Permission`.
    User:
      type: object
      description: |
        Sessão (`GET /auth/me` e login do mock). O front decide o que mostrar por `permissions`.
        `role` é o único papel do produto no token; `permissions` é a interseção do claim
        `resource_access.agentes-agro.roles` com o enum `Permission` (ADR 0015, D3).
      required: [id, name, email, role, primary_farm, company, farm_scope, permissions]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        primary_farm:
          description: Fazenda principal do usuário, exibida no rodapé do menu.
          oneOf:
            - $ref: "#/components/schemas/FarmRef"
            - type: "null"
        company:
          $ref: "#/components/schemas/CompanyRef"
        farm_scope:
          $ref: "#/components/schemas/FarmScope"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    FarmRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    FarmStatus:
      type: string
      enum: [draft, active, pending]
      description: |
        draft: rascunho do assistente; active: cadastro completo; pending: cadastro completo com algum vinculado
        sem o documento obrigatório (calculado, nunca enviado pelo cliente).
    ProductionType:
      type: string
      enum: [coffee, grains, livestock, mixed]
    SprayCondition:
      type: string
      enum: [suitable, attention, unsuitable, rain]
      description: Condição de pulverização calculada pelo backend (spray-planner). O front apenas exibe.
    SprayOutlook:
      type: object
      description: |
        Resumo da condição de pulverização, calculado no backend a partir das regras de Delta T,
        vento e chuva. Nulo enquanto a fazenda não tiver perímetro ou previsão.
      required: [condition, headline]
      properties:
        condition:
          $ref: "#/components/schemas/SprayCondition"
        headline:
          type: string
          description: Frase curta pronta para exibir (ex. "2 janelas aptas hoje").
    Crop:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          examples: [coffee_arabica]
        name:
          type: string
          examples: [Café arábica]
    FarmOwnerShare:
      type: object
      required: [owner_id, name, role, share_percent]
      properties:
        owner_id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/LinkRole"
        share_percent:
          type: [number, "null"]
          minimum: 0
          maximum: 100
    FarmSummary:
      type: object
      required:
        - id
        - name
        - code
        - city
        - state
        - status
        - production_type
        - total_area_ha
        - productive_area_ha
        - field_count
        - crops
        - owners
        - spray_outlook
        - forecast_point
        - perimeter
        - created_at
        - company_id
      properties:
        company_id:
          type: string
          description: Empresa dona da fazenda (tenant, ADR 0013).
        id:
          type: string
        name:
          type: string
        code:
          type: [string, "null"]
          description: Apelido/código curto exibido nas etiquetas do mapa (ex. STR-01).
        city:
          type: string
        state:
          type: string
          minLength: 2
          maxLength: 2
          description: UF.
        status:
          $ref: "#/components/schemas/FarmStatus"
        production_type:
          $ref: "#/components/schemas/ProductionType"
        total_area_ha:
          type: number
          description: Área do perímetro em hectares.
        productive_area_ha:
          type: number
          description: Soma das áreas dos talhões, em hectares.
        field_count:
          type: integer
        crops:
          type: array
          items:
            $ref: "#/components/schemas/Crop"
        owners:
          type: array
          items:
            $ref: "#/components/schemas/FarmOwnerShare"
        spray_outlook:
          oneOf:
            - $ref: "#/components/schemas/SprayOutlook"
            - type: "null"
        forecast_point:
          description: Ponto de previsão, usado como marcador no modo mapa da lista.
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        perimeter:
          description: |
            Perímetro **simplificado** (poucos vértices, WGS84) para a miniatura e o modo mapa
            da lista. A geometria completa fica em `Farm.location.perimeter`.
          oneOf:
            - $ref: "#/components/schemas/PerimeterGeometry"
            - type: "null"
        created_at:
          type: string
          format: date-time
          description: Data de cadastro; alimenta o indicador "+N este mês".
    FarmLocation:
      type: object
      required: [postal_code, car_number, forecast_point, perimeter]
      properties:
        postal_code:
          type: [string, "null"]
          description: CEP, apenas dígitos.
        car_number:
          type: [string, "null"]
          description: Número do CAR (Cadastro Ambiental Rural).
        forecast_point:
          description: Ponto usado para buscar a previsão do tempo (sede ou centróide do perímetro).
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        perimeter:
          oneOf:
            - $ref: "#/components/schemas/PerimeterGeometry"
            - type: "null"
    Farm:
      allOf:
        - $ref: "#/components/schemas/FarmSummary"
        - type: object
          required: [cooperative, location, updated_at]
          properties:
            cooperative:
              type: [string, "null"]
            location:
              $ref: "#/components/schemas/FarmLocation"
            updated_at:
              type: string
              format: date-time
    FarmInput:
      type: object
      required: [name, production_type, city, state, status, location, owners]
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: [string, "null"]
        cooperative:
          type: [string, "null"]
        production_type:
          $ref: "#/components/schemas/ProductionType"
        city:
          type: string
        state:
          type: string
          minLength: 2
          maxLength: 2
        status:
          type: string
          enum: [draft, active]
          description: "`pending` é atribuído pela API, nunca enviado."
        location:
          type: object
          required: [postal_code, car_number, forecast_point, perimeter]
          properties:
            postal_code:
              type: [string, "null"]
            car_number:
              type: [string, "null"]
            forecast_point:
              oneOf:
                - $ref: "#/components/schemas/GeoPoint"
                - type: "null"
            perimeter:
              oneOf:
                - $ref: "#/components/schemas/PerimeterGeometry"
                - type: "null"
        owners:
          type: array
          items:
            $ref: "#/components/schemas/FarmOwnerShareInput"
    FarmOwnerShareInput:
      type: object
      required: [owner_id, role, share_percent]
      properties:
        owner_id:
          type: string
        role:
          $ref: "#/components/schemas/LinkRole"
        share_percent:
          type: [number, "null"]
          minimum: 0
          maximum: 100
    FarmSummaryPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FarmSummary"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    PerimeterSourceFormat:
      type: string
      enum: [kml, kmz, geojson, shapefile]
    PerimeterImport:
      type: object
      required: [source_format, perimeter, area_ha, centroid]
      properties:
        source_format:
          $ref: "#/components/schemas/PerimeterSourceFormat"
        perimeter:
          $ref: "#/components/schemas/PerimeterGeometry"
        area_ha:
          type: number
          description: Área calculada pela API, em hectares.
        centroid:
          $ref: "#/components/schemas/GeoPoint"
        municipality:
          type: [string, "null"]
          description: Município (malha do IBGE) que contém um ponto interno do perímetro; nulo quando desconhecido.
        state:
          type: [string, "null"]
          minLength: 2
          maxLength: 2
          description: UF do município identificado.
        datum:
          type: [string, "null"]
          description: Sistema de referência do arquivo de origem (ex. "SIRGAS 2000"); a resposta é sempre WGS84.
        field_count:
          type: [integer, "null"]
          minimum: 0
          description: Polígonos internos encontrados no arquivo (possíveis talhões), além do perímetro.
    Field:
      type: object
      required:
        - id
        - farm_id
        - name
        - block
        - area_ha
        - crop
        - variety
        - season
        - planting_date
        - row_spacing_m
        - plant_spacing_m
        - plants_per_ha
        - polygon
        - spray_condition
        - last_application_at
      properties:
        id:
          type: string
        farm_id:
          type: string
        name:
          type: string
        block:
          type: [string, "null"]
          description: Área (bloco) que agrupa talhões, ex. "Área Norte".
        area_ha:
          type: number
          description: Calculada pela API a partir do polígono.
        crop:
          $ref: "#/components/schemas/Crop"
        variety:
          type: [string, "null"]
          examples: [Catuaí 144]
        season:
          type: [string, "null"]
          description: Safra, ex. "2026/27".
        planting_date:
          type: [string, "null"]
          format: date
        row_spacing_m:
          type: [number, "null"]
          description: Espaçamento entre linhas, em metros.
        plant_spacing_m:
          type: [number, "null"]
          description: Espaçamento entre plantas, em metros.
        plants_per_ha:
          type: [integer, "null"]
          description: Estande calculado pela API a partir do espaçamento.
        polygon:
          $ref: "#/components/schemas/GeoJsonPolygon"
        spray_condition:
          description: Condição atual de pulverização, calculada no backend. Nula sem previsão.
          oneOf:
            - $ref: "#/components/schemas/SprayCondition"
            - type: "null"
        last_application_at:
          type: [string, "null"]
          format: date-time
    FieldInput:
      type: object
      required: [name, crop_code, polygon]
      properties:
        name:
          type: string
          minLength: 1
        block:
          type: [string, "null"]
        crop_code:
          type: string
        variety:
          type: [string, "null"]
        season:
          type: [string, "null"]
        planting_date:
          type: [string, "null"]
          format: date
        row_spacing_m:
          type: [number, "null"]
          exclusiveMinimum: 0
        plant_spacing_m:
          type: [number, "null"]
          exclusiveMinimum: 0
        polygon:
          $ref: "#/components/schemas/GeoJsonPolygon"
    TerrainStatus:
      type: string
      description: |
        `not_calculated`: nunca calculado. `pending`: aguardando cálculo (pedido ou polígono alterado).
        `calculating`: em andamento. `ready`: calculado. `failed`: não foi possível calcular (ver `failure_reason`).
      enum: [not_calculated, pending, calculating, ready, failed]
    SlopeClass:
      type: string
      description: |
        Classe de relevo da Embrapa pela declividade média: `flat` (plano), `gently_undulating` (suave ondulado),
        `undulating` (ondulado), `strongly_undulating` (forte ondulado), `mountainous` (montanhoso). São 4 limites
        superiores configuráveis (padrão 3, 8, 20 e 45 %): `flat` até 3 %, `gently_undulating` até 8 %, `undulating`
        até 20 %, `strongly_undulating` até 45 % e `mountainous` acima de 45 %. A classe "escarpado" (acima de 75 %)
        da Embrapa não existe aqui: fica absorvida por `mountainous`.
      enum: [flat, gently_undulating, undulating, strongly_undulating, mountainous]
    TerrainPosition:
      type: string
      description: Posição no relevo em relação ao entorno. `hilltop` (topo), `slope` (encosta), `lowland` (baixada).
      enum: [hilltop, slope, lowland]
    TerrainAspect:
      type: string
      description: Exposição predominante da encosta; `flat` quando a declividade não define direção.
      enum: [north, northeast, east, southeast, south, southwest, west, northwest, flat]
    TerrainSource:
      type: string
      description: Origem do valor efetivo. `calculated` (modelo de elevação) ou `manual` (ajuste).
      enum: [calculated, manual]
    TerrainAdjustmentOrigin:
      type: string
      enum: [topographic_survey, field_assessment]
    SprayMethod:
      type: string
      description: |
        Método de aplicação. `knapsack` (costal), `tractor_boom` (tratorizado de barra), `self_propelled`
        (autopropelido), `airblast` (turbopulverizador), `aircraft` (avião), `drone` (ARP).
      enum: [knapsack, tractor_boom, self_propelled, airblast, aircraft, drone]
    MethodFitStatus:
      type: string
      description: |
        Compatibilidade do método com o relevo do talhão. Só considera a declividade; bula, solo, porte e zona
        tampão são avaliados pelo planejador.
      enum: [compatible, restricted, unsuitable]
    ElevationModel:
      type: object
      required: [source, resolution_m, version]
      properties:
        source:
          type: string
          examples: [Copernicus DEM GLO-30]
        resolution_m:
          type: number
          examples: [30]
        version:
          type: string
          examples: ["GLO-30 COG 2022-05"]
    TerrainMeasurement:
      type: object
      description: Medidas do relevo. `slope_p90_pct` e `aspect` são nulos em ajuste manual.
      required: [slope_mean_pct, slope_p90_pct, slope_max_pct, slope_class, position, aspect]
      properties:
        slope_mean_pct:
          type: number
          description: Declividade média, em %.
        slope_p90_pct:
          type: [number, "null"]
          description: Declividade abaixo da qual ficam 90 % da área, em %.
        slope_max_pct:
          type: number
          description: Declividade máxima, em %.
        slope_class:
          $ref: "#/components/schemas/SlopeClass"
        position:
          $ref: "#/components/schemas/TerrainPosition"
        aspect:
          oneOf:
            - $ref: "#/components/schemas/TerrainAspect"
            - type: "null"
    SlopeClassArea:
      type: object
      required: [slope_class, area_ha, share_pct]
      properties:
        slope_class:
          $ref: "#/components/schemas/SlopeClass"
        area_ha:
          type: number
        share_pct:
          type: number
          description: Participação na área do talhão, em %.
    ElevationProfilePoint:
      type: object
      required: [distance_m, elevation_m]
      properties:
        distance_m:
          type: number
          description: Distância a partir do ponto mais alto, ao longo da linha de maior declive.
        elevation_m:
          type: number
    TerrainCalculation:
      type: object
      description: Resultado do cálculo a partir do modelo de elevação.
      required: [measurement, elevation_min_m, elevation_max_m, class_areas, profile, elevation_model, calculated_at]
      properties:
        measurement:
          $ref: "#/components/schemas/TerrainMeasurement"
        elevation_min_m:
          type: number
        elevation_max_m:
          type: number
        class_areas:
          type: array
          description: Uma entrada por classe, na ordem de `SlopeClass`, inclusive as de área zero.
          items:
            $ref: "#/components/schemas/SlopeClassArea"
        profile:
          type: array
          items:
            $ref: "#/components/schemas/ElevationProfilePoint"
        elevation_model:
          $ref: "#/components/schemas/ElevationModel"
        calculated_at:
          type: string
          format: date-time
    TerrainAdjustment:
      type: object
      required: [origin, measurement, justification, adjusted_by, adjusted_at]
      properties:
        origin:
          $ref: "#/components/schemas/TerrainAdjustmentOrigin"
        measurement:
          $ref: "#/components/schemas/TerrainMeasurement"
        justification:
          type: string
        adjusted_by:
          $ref: "#/components/schemas/PersonRef"
        adjusted_at:
          type: string
          format: date-time
    MethodFit:
      type: object
      description: |
        Com o relevo calculado, a parte da área acima do limite decide o `status`. No ajuste manual não há
        distribuição: média acima do limite é `unsuitable`, máxima acima do limite é `restricted`, senão `compatible`.
      required: [method, slope_limit_pct, limit_source, status, area_above_limit_pct]
      properties:
        method:
          $ref: "#/components/schemas/SprayMethod"
        slope_limit_pct:
          type: [number, "null"]
          description: Limite de declividade do método; nulo quando o método não é limitado por declividade.
        limit_source:
          type: string
          description: "`reference`: limite configurado na API. `equipment`: limite do equipamento cadastrado (futuro)."
          enum: [reference, equipment]
        status:
          $ref: "#/components/schemas/MethodFitStatus"
        area_above_limit_pct:
          type: [number, "null"]
          description: |
            Parte da área acima do limite, em %. Nula sem limite ou em ajuste manual (sem distribuição); nesse caso
            `status` vem da comparação da média e da máxima com o limite.
    FieldTerrainSummary:
      type: object
      required:
        [field_id, field_name, block, area_ha, status, failure_reason, source, measurement, elevation_min_m, elevation_max_m, has_restricted_method]
      properties:
        field_id:
          type: string
        field_name:
          type: string
        block:
          type: [string, "null"]
        area_ha:
          type: number
        status:
          $ref: "#/components/schemas/TerrainStatus"
        failure_reason:
          type: [string, "null"]
        source:
          oneOf:
            - $ref: "#/components/schemas/TerrainSource"
            - type: "null"
        measurement:
          description: Valor efetivo (ajuste ou calculado); nulo sem relevo.
          oneOf:
            - $ref: "#/components/schemas/TerrainMeasurement"
            - type: "null"
        elevation_min_m:
          type: [number, "null"]
          description: Altitude mínima calculada (camada "Altitude" do mapa); nula sem cálculo, mesmo com ajuste manual.
        elevation_max_m:
          type: [number, "null"]
        has_restricted_method:
          type: boolean
          description: Algum método limitado por declividade está `restricted` ou `unsuitable` neste talhão.
    FarmTerrain:
      type: object
      required: [farm_id, summary, progress, items]
      properties:
        farm_id:
          type: string
        summary:
          type: object
          required:
            [field_count, calculated_field_count, slope_mean_pct, restricted_field_count, elevation_min_m, elevation_max_m, calculated_at]
          properties:
            field_count:
              type: integer
            calculated_field_count:
              type: integer
            slope_mean_pct:
              type: [number, "null"]
              description: Média da declividade efetiva ponderada pela área dos talhões com relevo.
            restricted_field_count:
              type: integer
            elevation_min_m:
              type: [number, "null"]
            elevation_max_m:
              type: [number, "null"]
            calculated_at:
              type: [string, "null"]
              format: date-time
              description: Cálculo mais recente entre os talhões.
        progress:
          description: Presente enquanto houver talhão `pending` ou `calculating` de um pedido em andamento.
          oneOf:
            - type: object
              required: [total, done]
              properties:
                total:
                  type: integer
                done:
                  type: integer
            - type: "null"
        items:
          type: array
          description: Ordenados por bloco e nome, como em `listFarmFields`.
          items:
            $ref: "#/components/schemas/FieldTerrainSummary"
    FieldTerrain:
      type: object
      required:
        [field_id, farm_id, status, failure_reason, source, effective, calculated, adjustment, adjustment_outdated, method_fits]
      properties:
        field_id:
          type: string
        farm_id:
          type: string
        status:
          $ref: "#/components/schemas/TerrainStatus"
        failure_reason:
          type: [string, "null"]
        source:
          oneOf:
            - $ref: "#/components/schemas/TerrainSource"
            - type: "null"
        effective:
          description: O que vale para classe e métodos (ajuste, se houver; senão o calculado).
          oneOf:
            - $ref: "#/components/schemas/TerrainMeasurement"
            - type: "null"
        calculated:
          oneOf:
            - $ref: "#/components/schemas/TerrainCalculation"
            - type: "null"
        adjustment:
          oneOf:
            - $ref: "#/components/schemas/TerrainAdjustment"
            - type: "null"
        adjustment_outdated:
          type: boolean
          description: O cálculo mais recente diverge do ajuste acima do limite configurado; vale revisar o ajuste.
        method_fits:
          type: array
          description: Vazio sem relevo efetivo.
          items:
            $ref: "#/components/schemas/MethodFit"
    SoilTexture:
      type: string
      description: Textura do solo do talhão. `sandy` (arenoso), `medium` (médio), `clay` (argiloso).
      enum: [sandy, medium, clay]
    SoilState:
      type: string
      description: |
        Estado do solo para o tráfego, do melhor ao pior: `dry` (seco) e `ideal` liberam todo o tráfego terrestre,
        `moist` (úmido) só máquinas leves, `waterlogged` (encharcado) bloqueia. `unknown`: sem fonte de chuva ou
        sem textura.
      enum: [dry, ideal, moist, waterlogged, unknown]
    SoilBasis:
      type: string
      description: |
        O que decidiu o estado de hoje: `inspection` (vistoria válida), `measured_rain` (pluviômetro ou estação),
        `model` (pior entre chuva e umidade do modelo) ou `none` (sem dados).
      enum: [inspection, measured_rain, model, none]
    RainSource:
      type: string
      description: "`gauge`: pluviômetro lançado na tela. `station`: estação da fazenda. `model`: célula do modelo de previsão, não o talhão."
      enum: [gauge, station, model]
    EligibilityVerdict:
      type: string
      enum: [apt, attention, unfit]
    EligibilityReason:
      type: string
      description: Motivo do veredito, em código; a tela e o agente o traduzem. Números vão em campos próprios.
      enum:
        [slope_restricted, slope_unsuitable, terrain_unknown, soil_moist, soil_waterlogged, soil_unknown, slope_restricted_on_wet_soil]
    TrafficabilityDataIssue:
      type: string
      description: |
        Dado que faltou no cálculo: `no_rain_source` (nem pluviômetro nem modelo), `no_soil_texture` (talhão sem
        textura), `weather_unavailable` (fonte de previsão fora do ar; projeção ausente), `terrain_not_calculated`
        (relevo sem cálculo; métodos pesados em atenção).
      enum: [no_rain_source, no_soil_texture, weather_unavailable, terrain_not_calculated]
    RainAccumulation:
      type: object
      required: [last_24h_mm, last_48h_mm, last_72h_mm, last_7d_mm, source, source_name, observed_at]
      properties:
        last_24h_mm:
          type: number
          minimum: 0
        last_48h_mm:
          type: number
          minimum: 0
        last_72h_mm:
          type: number
          minimum: 0
        last_7d_mm:
          type: number
          minimum: 0
        source:
          $ref: "#/components/schemas/RainSource"
        source_name:
          type: [string, "null"]
          description: Nome do pluviômetro ou da estação; nulo para o modelo.
        observed_at:
          type: string
          format: date-time
    ModelSoilMoisture:
      type: object
      required: [volumetric_m3m3, field_capacity_m3m3, field_capacity_pct]
      properties:
        volumetric_m3m3:
          type: number
          description: Umidade volumétrica do modelo na camada de 0 a 27 cm. Só tendência.
        field_capacity_m3m3:
          type: number
        field_capacity_pct:
          type: number
          description: Umidade como porcentagem da capacidade de campo.
    SoilInspectionView:
      type: object
      required: [state, inspected_at, valid_until, inspected_by]
      properties:
        state:
          $ref: "#/components/schemas/SoilState"
        inspected_at:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        inspected_by:
          $ref: "#/components/schemas/PersonRef"
    SoilStatus:
      type: object
      required: [state, basis, texture, thresholds_source, rain, model_moisture, inspection]
      properties:
        state:
          $ref: "#/components/schemas/SoilState"
        basis:
          $ref: "#/components/schemas/SoilBasis"
        texture:
          oneOf:
            - $ref: "#/components/schemas/SoilTexture"
            - type: "null"
        thresholds_source:
          type: string
          description: "`heuristic`: limites iniciais ainda não calibrados; `calibrated`: revisados pelo agrônomo."
          enum: [heuristic, calibrated]
        rain:
          oneOf:
            - $ref: "#/components/schemas/RainAccumulation"
            - type: "null"
        model_moisture:
          oneOf:
            - $ref: "#/components/schemas/ModelSoilMoisture"
            - type: "null"
        inspection:
          description: Vistoria ainda válida; nula quando não há ou já venceu.
          oneOf:
            - $ref: "#/components/schemas/SoilInspectionView"
            - type: "null"
    DailyRainEntry:
      type: object
      required: [date, rain_mm, kind, source]
      properties:
        date:
          type: string
          format: date
        rain_mm:
          type: number
          minimum: 0
        kind:
          type: string
          description: |
            `measured`: dia passado (hoje inclusive), da mesma fonte do estado (pluviômetro ou modelo; o modelo
            é uma estimativa da célula, não a medida do talhão). `forecast`: dia da previsão do modelo.
          enum: [measured, forecast]
        source:
          $ref: "#/components/schemas/RainSource"
    MethodEligibility:
      type: object
      required: [method, verdict, reasons, area_above_limit_pct]
      properties:
        method:
          $ref: "#/components/schemas/SprayMethod"
        verdict:
          $ref: "#/components/schemas/EligibilityVerdict"
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/EligibilityReason"
        area_above_limit_pct:
          type: [number, "null"]
          description: Parte da área acima do limite de declividade do método, quando conhecida.
    TrafficabilityDay:
      type: object
      required: [date, soil_state, methods]
      properties:
        date:
          type: string
          format: date
        soil_state:
          $ref: "#/components/schemas/SoilState"
        methods:
          type: array
          description: Um item por método de aplicação, na ordem do enum `SprayMethod`.
          items:
            $ref: "#/components/schemas/MethodEligibility"
    MethodRelease:
      type: object
      required: [method, required_state, date]
      properties:
        method:
          $ref: "#/components/schemas/SprayMethod"
        required_state:
          $ref: "#/components/schemas/SoilState"
        date:
          type: [string, "null"]
          format: date
          description: Primeiro dia (hoje inclusive) em que o solo atende ao método; nulo se não houver no horizonte.
    FieldTrafficability:
      type: object
      required: [field_id, farm_id, as_of, soil, rain_daily, days, releases, data_issues]
      properties:
        field_id:
          type: string
        farm_id:
          type: string
        as_of:
          type: string
          format: date-time
        soil:
          $ref: "#/components/schemas/SoilStatus"
        rain_daily:
          type: array
          description: Chuva diária dos últimos 7 dias (medida) e dos próximos `days` dias (prevista), em ordem de data.
          items:
            $ref: "#/components/schemas/DailyRainEntry"
        days:
          type: array
          description: Hoje e os próximos `days` dias.
          items:
            $ref: "#/components/schemas/TrafficabilityDay"
        releases:
          type: array
          description: Liberação de cada método terrestre; aéreos não dependem do solo e não aparecem.
          items:
            $ref: "#/components/schemas/MethodRelease"
        data_issues:
          type: array
          items:
            $ref: "#/components/schemas/TrafficabilityDataIssue"
    RainGauge:
      type: object
      required: [id, farm_id, name, location, created_at, updated_at, version]
      properties:
        id:
          type: string
        farm_id:
          type: string
        name:
          type: string
        location:
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
    RainGaugeInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        location:
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
    RainGaugePatch:
      type: object
      description: Chave ausente mantém o valor; `location` nulo remove a localização.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        location:
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
    RainReading:
      type: object
      required: [id, rain_gauge_id, rain_mm, observed_at, recorded_by, recorded_at]
      properties:
        id:
          type: string
        rain_gauge_id:
          type: string
        rain_mm:
          type: number
          minimum: 0
          maximum: 500
          description: Chuva acumulada desde a leitura anterior.
        observed_at:
          type: string
          format: date-time
        recorded_by:
          $ref: "#/components/schemas/PersonRef"
        recorded_at:
          type: string
          format: date-time
    RainReadingInput:
      type: object
      required: [rain_mm, observed_at]
      properties:
        rain_mm:
          type: number
          minimum: 0
          maximum: 500
        observed_at:
          type: string
          format: date-time
          description: Instante da leitura; não pode estar no futuro.
    SoilInspection:
      type: object
      required: [id, field_id, farm_id, state, inspected_at, valid_until, inspected_by, note]
      properties:
        id:
          type: string
        field_id:
          type: string
        farm_id:
          type: string
        state:
          $ref: "#/components/schemas/SoilState"
        inspected_at:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
          description: Até quando a vistoria substitui o cálculo (`inspected_at` + `API_SOIL_INSPECTION_VALIDITY`).
        inspected_by:
          $ref: "#/components/schemas/PersonRef"
        note:
          type: [string, "null"]
    SoilInspectionInput:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [dry, ideal, moist, waterlogged]
        inspected_at:
          type: string
          format: date-time
          description: Padrão, agora; não pode estar no futuro.
        note:
          type: [string, "null"]
          maxLength: 500
    SoilProfile:
      type: object
      required: [field_id, farm_id, soil_texture, rain_gauge]
      properties:
        field_id:
          type: string
        farm_id:
          type: string
        soil_texture:
          oneOf:
            - $ref: "#/components/schemas/SoilTexture"
            - type: "null"
        rain_gauge:
          description: Pluviômetro da mesma fazenda que atende o talhão; nulo sem vínculo (o talhão usa o modelo).
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: string
                name:
                  type: string
            - type: "null"
    SoilProfileInput:
      type: object
      required: [soil_texture, rain_gauge_id]
      properties:
        soil_texture:
          oneOf:
            - $ref: "#/components/schemas/SoilTexture"
            - type: "null"
        rain_gauge_id:
          type: [string, "null"]
          description: Pluviômetro da mesma fazenda; nulo desfaz o vínculo.
    TerrainCalculationRequest:
      type: object
      properties:
        scope:
          type: string
          enum: [missing, all]
          default: missing
    FieldTerrainAdjustmentInput:
      type: object
      required: [origin, slope_mean_pct, slope_max_pct, position, justification]
      properties:
        origin:
          $ref: "#/components/schemas/TerrainAdjustmentOrigin"
        slope_mean_pct:
          type: number
          minimum: 0
          maximum: 100
        slope_max_pct:
          type: number
          minimum: 0
          maximum: 100
          description: Não pode ser menor que `slope_mean_pct` (422).
        position:
          $ref: "#/components/schemas/TerrainPosition"
        justification:
          type: string
          minLength: 1
          maxLength: 1000
    PersonType:
      type: string
      enum: [individual, company]
      description: "individual: pessoa física (CPF); company: pessoa jurídica (CNPJ)."
    LinkRole:
      type: string
      enum: [owner, tenant, legal_representative]
      description: "owner: proprietário com participação; tenant: arrendatário; legal_representative: responsável legal sem participação."
    OwnerDocumentKind:
      type: string
      enum: [id_card, driver_license, articles_of_incorporation, other]
    OwnerDocument:
      type: object
      required: [id, kind, file_name, uploaded_at]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/OwnerDocumentKind"
        file_name:
          type: string
        uploaded_at:
          type: string
          format: date-time
    OwnerFarmLink:
      type: object
      required: [farm_id, farm_name, role, share_percent]
      properties:
        farm_id:
          type: string
        farm_name:
          type: string
        role:
          $ref: "#/components/schemas/LinkRole"
        share_percent:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: Participação na fazenda. Nula para arrendatário e responsável legal.
    OwnerFarmLinkInput:
      type: object
      required: [farm_id, role, share_percent]
      properties:
        farm_id:
          type: string
        role:
          $ref: "#/components/schemas/LinkRole"
        share_percent:
          type: [number, "null"]
          minimum: 0
          maximum: 100
    OwnerFarmLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OwnerFarmLink"
    OwnerSummary:
      type: object
      required: [id, person_type, name, document, has_pending_documents, links]
      properties:
        id:
          type: string
        person_type:
          $ref: "#/components/schemas/PersonType"
        name:
          type: string
          description: Nome completo (PF) ou razão social (PJ).
        document:
          type: string
          description: CPF (11 dígitos) ou CNPJ (14 dígitos), apenas dígitos. O front mascara na exibição.
        has_pending_documents:
          type: boolean
          description: |
