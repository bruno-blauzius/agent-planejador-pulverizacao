[project]
name = "label-advisor"
version = "0.1.0"
description = "RAG agent that answers questions about product labels and technical bulletins."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

# Lint/format come from the shared ruff.toml at the monorepo root; a [tool.ruff]
# section here would override it entirely, so it is intentionally absent.

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["label_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
