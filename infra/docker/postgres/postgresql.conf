# Postgres local configurado para se comportar como produção.
# Valores dimensionados para ~1 GB de memória (limite do container no compose).
# Em produção, recalcule shared_buffers (~25% da RAM) e effective_cache_size (~75%).

# --- Conexão -------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100
password_encryption = scram-sha-256

# --- Memória -------------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 128MB

# --- WAL e checkpoints (mesmo nível de produção, permite réplica e PITR) --------
wal_level = replica
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# --- Planejador (disco SSD) ----------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Extensões -----------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all

# --- Proteções contra sessões presas -------------------------------------------
idle_in_transaction_session_timeout = 60s
lock_timeout = 10s

# --- Logs ----------------------------------------------------------------------
log_destination = 'stderr'
log_line_prefix = '%m [%p] user=%u db=%d app=%a client=%h '
log_min_duration_statement = 500ms
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1s

# --- Localização ---------------------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.portuguese'
