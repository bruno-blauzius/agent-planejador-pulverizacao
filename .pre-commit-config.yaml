# Instalação: make hooks   (equivale a: pre-commit install --install-hooks -t pre-commit -t pre-push)
# Execução manual em tudo: make security   |   pre-commit run --all-files
# Decisões e motivos: docs/adr/0007-pre-commit-qualidade-e-seguranca.md
minimum_pre_commit_version: "4.0.0"

repos:
  # --- Higiene geral e arquivos proibidos ---------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # tsconfig aceita comentários (JSONC), que não são JSON válido.
        exclude: '(^|/)tsconfig[^/]*\.json$'
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: forbid-env-and-raw-data
        name: bloqueia .env e PDFs de data/raw
        description: CLAUDE.md proíbe commitar .env, chaves de API e PDFs de data/raw/.
        language: fail
        entry: "Arquivo proibido no commit (segredo ou dado bruto). Use .env.example e mantenha data/raw/ fora do git."
        files: '(^|/)\.env(\.(?!example$).+)?$|(^|/)data/raw/'

  # --- Segredos no código (todas as linguagens) ---------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- Python: saúde, padrões, SQL injection e segredos fixos -------------
  # ruff.toml (raiz) aplica as regras S (bandit), BLE/S110 (exceção silenciada)
  # e TID251 (framework proibido em domain/ e application/).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Bandit cobre B608 (SQL por concatenação) e B105-B107 (senha fixa) em
  # profundidade além do subconjunto S do ruff.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "bandit.yaml", "-q"]
        files: '^services/.*\.py$'

  # --- Dependências vulneráveis -------------------------------------------
  # Usam rede; rodam só quando o arquivo de dependências muda e antes do push.
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (CVEs em dependências Python)
        language: python
        additional_dependencies: ["pip-audit==2.9.0"]
        entry: bash -c 'for f in "$@"; do pip-audit --strict -r "$f" || exit 1; done' --
        files: '(^|/)requirements[^/]*\.txt$'
        stages: [pre-commit, pre-push]

      # --- Go -------------------------------------------------------------
      # Executam a partir de services/api (onde ficará o go.mod).
      - id: golangci-lint
        name: golangci-lint (lint, gofmt, gosec/SQL injection, errcheck)
        language: golang
        additional_dependencies: ["github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0"]
        entry: bash -c 'cd services/api && { [ -f go.mod ] || exit 0; } && golangci-lint run ./...'
        files: '^services/api/.*\.(go|mod|sum)$|^services/api/\.golangci\.yml$'
        pass_filenames: false

      - id: govulncheck
        name: govulncheck (CVEs em dependências Go)
        language: golang
        additional_dependencies: ["golang.org/x/vuln/cmd/govulncheck@v1.10.0"]
        entry: bash -c 'cd services/api && { [ -f go.mod ] || exit 0; } && govulncheck ./...'
        files: '^services/api/go\.(mod|sum)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]
