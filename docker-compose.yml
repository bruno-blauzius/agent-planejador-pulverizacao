# Ambiente local dos Agentes Agro.
#   make up      sobe tudo (equivale a: docker compose up -d --build)
#   make down    derruba os containers, mantém o volume do banco
# Decisões e motivos: docs/adr/0009-docker-compose-e-postgres.md
#
# Redes:
#   agro           rede privada do projeto; só nela o Postgres é alcançável.
#   inceres-infra  rede externa já existente (Redis, Kafka; RabbitMQ deve ser
#                  conectado a ela). Os serviços de aplicação entram nela para
#                  usar essa infraestrutura no futuro.
# Os nomes dos serviços têm prefixo "agro-" onde o nome seria genérico (api,
# web, postgres): na rede compartilhada, outro projeto com o mesmo nome
# tornaria a resolução DNS ambígua.

name: agentes-agro

x-app-hardening: &app-hardening
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Teto de 1 CPU e 1 GB por container de aplicação (o Postgres tem o seu próprio limite).
  # Estourar a memória faz o Docker matar o container (OOM), por isso o runtime
  # de cada serviço é ajustado abaixo para ficar sempre abaixo do teto.
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 1g
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

services:
  agro-postgres:
    # Imagem própria: pgvector + PostGIS (ADR 0014).
    build:
      context: ./infra/docker/postgres
    image: agentes-agro/postgres:dev
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agro_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: postgres
      # Conexões por rede exigem senha scram-sha-256, como em produção.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
      API_DB_MIGRATOR_PASSWORD: ${API_DB_MIGRATOR_PASSWORD:?defina API_DB_MIGRATOR_PASSWORD no .env}
      API_DB_APP_PASSWORD: ${API_DB_APP_PASSWORD:?defina API_DB_APP_PASSWORD no .env}
      LABEL_ADVISOR_DB_MIGRATOR_PASSWORD: ${LABEL_ADVISOR_DB_MIGRATOR_PASSWORD:?defina LABEL_ADVISOR_DB_MIGRATOR_PASSWORD no .env}
      LABEL_ADVISOR_DB_APP_PASSWORD: ${LABEL_ADVISOR_DB_APP_PASSWORD:?defina LABEL_ADVISOR_DB_APP_PASSWORD no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Só localhost: o banco nunca fica exposto na rede da máquina.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      <<: *healthcheck-timing
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - agro

  agro-api:
    <<: *app-hardening
    build:
      context: ./services/api
    image: agentes-agro/api:dev
    environment:
      API_PORT: "8080"
      # Coletor de lixo do Go respeita o teto do container (1 GB), com folga para stacks e buffers.
      GOMEMLIMIT: 800MiB
      GOMAXPROCS: "1"
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      API_CORS_ALLOWED_ORIGINS: ${API_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Papel de runtime (api_app: só DML). As senhas devem ser URL-safe.
      API_DATABASE_URL: postgres://api_app:${API_DB_APP_PASSWORD}@agro-postgres:5432/api?sslmode=disable
      # Keycloak do infra-docker (ADR 0015). A API o chama pelo endereço interno da rede inceres-infra;
      # o emissor (iss dos tokens) é o endereço público que o navegador enxerga.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-inceres}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://localhost:8180}
      KEYCLOAK_PROVISIONER_CLIENT_ID: ${KEYCLOAK_PROVISIONER_CLIENT_ID:-agentes-agro-provisioner}
      KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET:-}
      KEYCLOAK_AGENTES_AGRO_CLIENT_ID: ${KEYCLOAK_AGENTES_AGRO_CLIENT_ID:-agentes-agro}
      KEYCLOAK_AGENTES_AGRO_CLIENT_SECRET: ${KEYCLOAK_AGENTES_AGRO_CLIENT_SECRET:-}
      # URL pública da API: vira a redirect_uri (<url>/auth/callback) e o link dos e-mails de convite.
      AGENTES_AGRO_API_URL: ${AGENTES_AGRO_API_URL:-http://localhost:${API_HOST_PORT:-8080}}
      # URL pública do front: o /auth/callback redireciona para <url><return_to> e <url>/login?error=<código>.
      AGENTES_AGRO_WEB_URL: ${AGENTES_AGRO_WEB_URL:-http://localhost:${WEB_HOST_PORT:-3000}}
      # Sessão do navegador (cookie opaco). A chave cifra o refresh token em repouso: base64 de 32 bytes.
      API_SESSION_ENC_KEY: ${API_SESSION_ENC_KEY:-}
      API_SESSION_ENC_KEY_ID: ${API_SESSION_ENC_KEY_ID:-1}
      API_SESSION_ENC_OLD_KEYS: ${API_SESSION_ENC_OLD_KEYS:-}
      # Valores de negócio dos casos de uso.
      API_INVITATION_TTL: ${API_INVITATION_TTL:-72h}
      API_TRIAL_DURATION: ${API_TRIAL_DURATION:-336h}
      API_LAST_ACCESS_INTERVAL: ${API_LAST_ACCESS_INTERVAL:-5m}
      API_PAGE_SIZE_DEFAULT: ${API_PAGE_SIZE_DEFAULT:-20}
      API_PAGE_SIZE_MAX: ${API_PAGE_SIZE_MAX:-100}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    depends_on:
      agro-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      <<: *healthcheck-timing
    networks:
      - agro
      - inceres-infra

  spray-planner:
    <<: *app-hardening
    build:
      context: ./services/spray-planner
    image: agentes-agro/spray-planner:dev
    environment:
      SPRAY_PLANNER_LOG_LEVEL: ${SPRAY_PLANNER_LOG_LEVEL:-INFO}
      # O agente lê talhões pela API, nunca pelo banco.
      SPRAY_PLANNER_API_BASE_URL: http://agro-api:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    ports:
      - "127.0.0.1:${SPRAY_PLANNER_HOST_PORT:-8001}:8000"
    depends_on:
      agro-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      <<: *healthcheck-timing
    networks:
      - agro
      - inceres-infra

  label-advisor:
    <<: *app-hardening
    build:
      context: ./services/label-advisor
    image: agentes-agro/label-advisor:dev
    environment:
      LABEL_ADVISOR_LOG_LEVEL: ${LABEL_ADVISOR_LOG_LEVEL:-INFO}
      # Usado a partir da Fase 1 (pgvector). Senhas devem ser URL-safe.
      LABEL_ADVISOR_DATABASE_URL: postgresql://label_advisor_app:${LABEL_ADVISOR_DB_APP_PASSWORD}@agro-postgres:5432/label_advisor?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    ports:
      - "127.0.0.1:${LABEL_ADVISOR_HOST_PORT:-8003}:8000"
    depends_on:
      agro-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      <<: *healthcheck-timing
    networks:
      - agro
      - inceres-infra

  agro-web:
    <<: *app-hardening
    build:
      context: ./web
    image: agentes-agro/web:dev
    environment:
      # O front fala apenas com a API Go. SSR usa a rede interna (porta do
      # container); o navegador usa a porta publicada no host.
      NUXT_API_BASE_URL: http://agro-api:8080
      # Heap do Node abaixo do teto do container (1 GB); o restante é código nativo e buffers.
      NODE_OPTIONS: --max-old-space-size=768
      NUXT_PUBLIC_API_BASE: http://localhost:${API_HOST_PORT:-8080}
      # Sessão real pelo cookie HttpOnly da API (ADR 0015). O mock só existe em `make dev` (nuxt dev):
      # NUXT_PUBLIC_API_MOCK=true troca tudo por ele; MOCK_PENDING usa a API real e o mock só onde o contrato é `planned`.
      NUXT_PUBLIC_API_MOCK: ${NUXT_PUBLIC_API_MOCK:-false}
      NUXT_PUBLIC_API_MOCK_PENDING: ${NUXT_PUBLIC_API_MOCK_PENDING:-true}
      NUXT_PUBLIC_ACCOUNT_URL: ${NUXT_PUBLIC_ACCOUNT_URL:-${KEYCLOAK_URL:-http://localhost:8180}/realms/${KEYCLOAK_REALM:-inceres}/account}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      agro-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      <<: *healthcheck-timing
    networks:
      - agro
      - inceres-infra

volumes:
  postgres-data:

networks:
  agro:
    name: agentes-agro
  inceres-infra:
    external: true
